        : '<span class="selo selo-fim">FINALIZAR</span>';
      return '<tr>' +
        '<td><strong>' + esc(r.nome || r.username || "—") + '</strong>' +
          (r.email ? '<div class="mono">' + esc(r.email) + '</div>' : '') + '</td>' +
        '<td>' + selo + '</td>' +
        '<td class="mono">' + esc(soData(r.em)) + '</td>' +
        '<td class="mono">' + esc(soHora(r.em)) + '</td>' +
      '</tr>';
    }).join("");

    return '<div class="cartao">' +
      '<h2>Registro de uso</h2>' +
      '<div class="rolagem"><table class="tabela-uso"><thead><tr>' +
        '<th>Nome</th><th>Ação</th><th>Data</th><th>Horário</th>' +
      '</tr></thead><tbody>' + linhas + '</tbody></table></div>' +
    '</div>';
  }

  function blocoRegistro(){
    var atividade;
    if(state.logs.length === 0){
      atividade = '<div class="cartao"><h2>Registro de atividade</h2>' +
        '<div class="vazio">Nenhuma atividade registrada ainda.</div></div>';
    } else {
      var itens = state.logs.slice().reverse().map(function(l){
        return '<li>' +
          '<div class="registro-topo">' + esc(l.evento) + (l.alvo ? ' — ' + esc(l.alvo) : '') + '</div>' +
          '<div class="registro-meta">' + esc(dataHora(l.em)) + ' · ' + esc(l.por || "—") + '</div>' +
        '</li>';
      }).join("");
      atividade = '<div class="cartao"><h2>Registro de atividade</h2>' +
        '<ul class="registro">' + itens + '</ul></div>';
    }
    return blocoUso() + atividade;
  }

  function ligarEventos(){
    liga("form-login", "submit", entrar);
    liga("ver-login", "click", function(){ verSenha("login-senha", this); });
    liga("abrir-reset", "click", pedirRedefinicao);

    liga("form-troca", "submit", salvarSenhaInicial);
    liga("sair-troca", "click", sair);
    liga("sair", "click", sair);

    liga("alternar-trilho", "click", function(){
      state.trilhoAberto = !state.trilhoAberto;
      render();
    });
    liga("btn-uso", "click", alternarUso);
    liga("btn-coleta", "click", abrirColeta);
    liga("btn-atualizar", "click", atualizarDados);
    liga("base-importar", "click", importarBase);
    liga("dash-baixar", "click", baixarPlanilha);
    cada("[data-abrir-filtros]", function(b){
      b.addEventListener("click", function(){ abrirFiltros(b.getAttribute("data-abrir-filtros")); });
    });
    liga("arquivo-arquivar", "click", arquivarSelecionados);
    liga("arquivo-duplicados", "click", corrigirDuplicados);
    liga("arquivo-modo", "change", function(){ state.arquivoModo = this.value; });
    cada("[data-arquivar-mes]", function(c){
      c.addEventListener("change", function(){ state.arquivoSelecao[c.getAttribute("data-arquivar-mes")] = c.checked; });
    });
    cada("[data-restaurar-mes]", function(b){
      b.addEventListener("click", function(){ restaurarMes(b.getAttribute("data-restaurar-mes")); });
    });
    liga("listas-salvar", "click", salvarListas);
    liga("listas-add-assunto", "click", function(){
      var dados = coletarListasDoDOM();
      dados.assuntos.push({nome:"", grupo:"outros", placa:false});
      state.editListas = dados;
      render();
    });
    liga("listas-add-descricao", "click", function(){
      var dados = coletarListasDoDOM();
      dados.descricoes.push({nome:"", tipo:"finaliza"});
      state.editListas = dados;
      render();
    });
    liga("listas-restaurar", "click", function(){
      state.editListas = {
        assuntos: ASSUNTOS_PADRAO.map(function(a){ return {nome:a.nome, grupo:a.grupo, placa:a.placa}; }),
        descricoes: DESCRICOES_PADRAO.map(function(d){ return {nome:d.nome, tipo:d.tipo}; })
      };
      render();
    });
    liga("listas-descartar", "click", function(){
      state.editListas = null;
      render();
    });
    cada("[data-remover-assunto]", function(b){
      b.addEventListener("click", function(){
        var dados = coletarListasDoDOM();
        dados.assuntos.splice(Number(b.getAttribute("data-remover-assunto")), 1);
        state.editListas = dados;
        render();
      });
    });
    cada("[data-remover-descricao]", function(b){
      b.addEventListener("click", function(){
        var dados = coletarListasDoDOM();
        dados.descricoes.splice(Number(b.getAttribute("data-remover-descricao")), 1);
        state.editListas = dados;
        render();
      });
    });

    liga("copiar-coletor", "click", copiarCodigoColetor);
    liga("importar-coleta", "click", importarColeta);
    liga("limpar-coleta-app", "click", function(){
      if(!state.coleta.length) return toast("Não há registros para limpar.");
      if(confirm("Deseja apagar todos os registros da coleta?")){
        if(!ehAdministrativo())return toast("Só o administrador pode limpar a coleta.");
        db.ref("coleta").remove().then(function(){toast("Registros removidos do Firebase.");}).catch(function(){toast("Não foi possível excluir.");});
      }
    });
    cada(".coleta-assunto", function(sel){
      sel.addEventListener("change", function(){
        if(!ehAdministrativo())return toast("Somente o administrador pode alterar o assunto.");
        db.ref("coleta/"+this.getAttribute("data-id")+"/assunto").set(this.value).catch(function(){toast("Falha ao salvar assunto.");});
      });
    });
    cada("[data-abrir-caso]", function(b){
      b.addEventListener("click", function(){
        var alvo = b.getAttribute("data-abrir-caso");
        var caso = null;
        for(var i=0;i<state.coleta.length;i++){ if(String(state.coleta[i].id) === alvo) caso = state.coleta[i]; }
        if(caso) abrirAtendimento(caso);
      });
    });
    cada("[data-coleta-aba]", function(b){
      b.addEventListener("click", function(){
        state.coletaAba = b.getAttribute("data-coleta-aba");
        render();
      });
    });
    liga("btn-mais", "click", function(){ abrirAtendimento(); });
    liga("alternar-tema", "click", alternarTema);

    liga("form-novo", "submit", criarAcesso);
    liga("novo-cpf", "input", function(){ this.value = formatCPF(this.value); });
    liga("copiar-credencial", "click", copiarCredencial);
    liga("conta-salvar-senha", "click", trocarMinhaSenha);

    cada("[data-painel]", function(b){
      b.addEventListener("click", function(){
        if(state.painelAba === "listas" && b.getAttribute("data-painel") !== "listas") state.editListas = null;
        state.painelAba = b.getAttribute("data-painel");
        state.error = "";
        render();
      });
    });
    cada("[data-acao]", function(b){
      b.addEventListener("click", function(){
        var acao = b.getAttribute("data-acao");
        var alvo = b.getAttribute("data-alvo");
        if(acao === "editar") abrirEdicao(alvo);
        else if(acao === "perfil") mudarPerfil(alvo);
        else if(acao === "resetar") resetarSenha(alvo);
        else if(acao === "status") mudarStatus(alvo);
      });
    });
  }

  function liga(id, evento, fn){
    var el = document.getElementById(id);
    if(el) el.addEventListener(evento, fn);
  }
  function cada(seletor, fn){
    Array.prototype.forEach.call(document.querySelectorAll(seletor), fn);
  }

  function verSenha(id, btn){
    var inp = document.getElementById(id);
    if(!inp) return;
    var mostrar = inp.type === "password";
    inp.type = mostrar ? "text" : "password";
    btn.innerHTML = olhoSVG(mostrar);
    btn.setAttribute("aria-label", mostrar ? "Ocultar senha" : "Mostrar senha");
  }

  function ocupar(id, rotulo){
    var b = document.getElementById(id);
    if(b){ b.disabled = true; b.setAttribute("data-rotulo", b.textContent); b.textContent = rotulo; }
  }
  function liberar(id){
    var b = document.getElementById(id);
    if(b){
      b.disabled = false;
      var r = b.getAttribute("data-rotulo");
      if(r) b.textContent = r;
    }
  }

  function copiarCodigoColetor(){
    var el = document.getElementById("codigo-coletor");
    if(!el){ toast("Código do coletor não encontrado no arquivo."); return; }
    copiar(el.textContent.trim(), "Código copiado. Feche o coletor antigo no X e execute este no Reclame Aqui.");
  }

  async function alternarUso(){
    if(state.ocupadoUso) return;
    if(ehMinhaSessao()) await finalizarUso(false);
    else {
      await iniciarUso();
      if(ehMinhaSessao()) abrirAtendimento();
    }
  }

  async function iniciarUso(){
    var u = state.currentUser;
    if(!u) return;
    if(state.sessao && state.sessao.username){
      toast("O sistema já está em uso por " + state.sessao.username + ".");
      return;
    }

    state.ocupadoUso = true;
    ocupar("btn-uso", "AGUARDE…");

    var dados = {
      username: u.username || "",
      nome: nomeExibido(u),
      email: u.email || "",
      uid: u.uid || "",
      em: new Date().toISOString()
    };

    try {
      var res = await db.ref("sessaoAtiva").transaction(function(atual){
        if(atual && atual.username) return;
        return dados;
      });
      if(!res.committed){
        state.ocupadoUso = false;
        toast("Outra pessoa iniciou antes de você.");
        render();
        return;
      }
      aoCair = db.ref("sessaoAtiva").onDisconnect();
      aoCair.remove();
      state.sessao = dados;
      await registrarUso("INICIAR");
      toast("Uso iniciado.");
    } catch(err){
      toast(msgBanco(err));
    }

    state.ocupadoUso = false;
    render();
  }

  async function finalizarUso(silencioso){
    if(!ehMinhaSessao()) return;
    state.ocupadoUso = true;
    if(!silencioso) ocupar("btn-uso", "AGUARDE…");

    try {
      if(aoCair){ try { await aoCair.cancel(); } catch(e){} aoCair = null; }
      await db.ref("sessaoAtiva").remove();
      state.sessao = null;
      await registrarUso("FINALIZAR");
      if(!silencioso) toast("Uso finalizado.");
    } catch(err){
      if(!silencioso) toast(msgBanco(err));
    }

    state.ocupadoUso = false;
    if(!silencioso) render();
  }

  async function entrar(e){
    e.preventDefault();
    state.error = "";

    var nome = (document.getElementById("login-usuario").value || "").trim();
    var senha = document.getElementById("login-senha").value || "";

    if(!nome || !senha){ state.error = "Preencha usuário e senha."; render(); return; }

    ocupar("btn-entrar", "Entrando…");

    try {
      await tentarEntrar(emailsCandidatos(nome), senha);
    } catch(err){
      state.error = msgAuth(err);
      liberar("btn-entrar");
      render();
    }
  }

  async function tentarEntrar(emails, senha){
    var ultimo = null;
    for(var i=0;i<emails.length;i++){
      try {
        await auth.signInWithEmailAndPassword(emails[i], senha);
        return;
      } catch(err){
        ultimo = err;
        var c = err && err.code;
        var eDeCredencial =
          c === "auth/invalid-credential" || c === "auth/user-not-found" ||
          c === "auth/wrong-password"     || c === "auth/invalid-email";
        if(!eDeCredencial) throw err;
      }
    }
    throw ultimo;
  }

  async function pedirRedefinicao(){
    var campo = document.getElementById("login-usuario");
    var nome = ((campo && campo.value) || "").trim();
    if(!nome){
      state.error = "Escreva seu usuário no campo acima para receber o link.";
      render();
      return;
    }
    var emails = emailsCandidatos(nome);
    try {
      await auth.sendPasswordResetEmail(emails[0]);
      state.error = "";
      toast("Se essa conta existir, o link foi enviado para " + emails[0] + ".");
    } catch(err){
      state.error = msgAuth(err);
      render();
    }
  }

  async function salvarSenhaInicial(e){
    e.preventDefault();
    state.error = "";
    var s1 = document.getElementById("senha-nova").value || "";
    var s2 = document.getElementById("senha-confirma").value || "";

    if(s1.length < 6){ state.error = "A senha precisa de pelo menos 6 caracteres."; render(); return; }
    if(s1 !== s2){ state.error = "As duas senhas estão diferentes."; render(); return; }

    try {
      await auth.currentUser.updatePassword(s1);
    } catch(err){
      state.error = msgAuth(err);
      render();
      return;
    }

    var cadastro = state.currentUser;
    cadastro.tempPassword = false;
    cadastro.previousLogin = "";
    cadastro.lastLogin = new Date().toISOString();
    state.loginRegistrado = true;
    await salvarUsuarios();

    toast("Senha definida.");
    state.painelAba = "inicio";
    state.screen = "painel";
    render();
  }

  async function trocarMinhaSenha(){
    var feedback = document.getElementById("troca-feedback");
    var s1 = document.getElementById("conta-senha1").value || "";
    var s2 = document.getElementById("conta-senha2").value || "";

    if(s1.length < 6){ feedback.innerHTML = '<div class="aviso aviso-erro">A senha precisa de pelo menos 6 caracteres.</div>'; return; }
    if(s1 !== s2){ feedback.innerHTML = '<div class="aviso aviso-erro">As duas senhas estão diferentes.</div>'; return; }

    try {
      await auth.currentUser.updatePassword(s1);
    } catch(err){
      feedback.innerHTML = '<div class="aviso aviso-erro">' + esc(msgAuth(err)) + '</div>';
      return;
    }

    if(state.currentUser.tempPassword){
      state.currentUser.tempPassword = false;
      await salvarUsuarios();
    }
    document.getElementById("conta-senha1").value = "";
    document.getElementById("conta-senha2").value = "";
    feedback.innerHTML = '<div class="aviso aviso-ok">Senha alterada.</div>';
    toast("Senha alterada.");
  }

  function appSecundario(){
    try { return firebase.app("criacao"); }
    catch(e){ return firebase.initializeApp(firebaseConfig, "criacao"); }
  }

  async function criarAcesso(e){
    e.preventDefault();
    state.error = "";
    if(!ehAdministrativo()){ state.error = "Só o perfil administrativo pode criar acessos."; render(); return; }

    var nomePessoa = (document.getElementById("novo-nome").value || "").trim();
    var nome = (document.getElementById("novo-usuario").value || "").trim().toLowerCase();
    var dominio = document.getElementById("novo-dominio").value;
    var cpf = digitos(document.getElementById("novo-cpf").value || "");
    var perfil = document.getElementById("novo-perfil").value;

    if(!nomePessoa){ state.error = "Informe o nome da pessoa."; render(); return; }
    if(!nome){ state.error = "Informe o nome de usuário."; render(); return; }
    if(cpf.length !== 11){ state.error = "O CPF precisa ter 11 dígitos."; render(); return; }

    var email = nome.indexOf("@") !== -1 ? nome : (nome + "@" + dominio);
    if(acharUsuario(usuarioDoEmail(email)) || acharPorEmail(email)){
      state.error = "Já existe um acesso com esse usuário."; render(); return;
    }

    var senha = gerarSenha();
    ocupar("btn-criar", "Criando…");

    var secundario = appSecundario().auth();
    var credencial;
    try {
      credencial = await secundario.createUserWithEmailAndPassword(email, senha);
    } catch(err){
      state.error = msgAuth(err);
      liberar("btn-criar");
      render();
      return;
    }

    state.users.push({
      uid: credencial.user.uid,
      email: email,
      username: usuarioDoEmail(email),
      nome: nomePessoa,
      cpf: cpf,
      active: true,
      canEdit: perfil === "administrativo",
      tempPassword: true,
      createdAt: new Date().toISOString(),
      lastLogin: "",
      previousLogin: ""
    });

    var ok = await salvarUsuarios();
    if(!ok){
      state.users.pop();
      try { await credencial.user.delete(); } catch(e2){}
      try { await secundario.signOut(); } catch(e3){}
      liberar("btn-criar");
      render();
      return;
    }

    try { await secundario.signOut(); } catch(e4){}

    state.ultimaCredencial = {
      nome: nomePessoa,
      username: usuarioDoEmail(email),
      email: email,
      password: senha,
      perfil: perfil === "administrativo" ? "Administrativo" : "Colaborativo"
    };
    registrar("Acesso criado (" + state.ultimaCredencial.perfil + ")", state.ultimaCredencial.username);
    toast("Acesso criado.");
    render();
  }

  function copiarCredencial(){
    var c = state.ultimaCredencial;
    if(!c) return;
    copiar(
      "RA Detran-SP\nNome: " + c.nome +
      "\nUsuário: " + c.username +
      "\nE-mail: " + c.email +
      "\nPerfil: " + c.perfil +
      "\nSenha temporária: " + c.password,
      "Dados copiados."
    );
  }

  async function resetarSenha(username){
    if(!ehAdministrativo()) return;
    var user = acharUsuario(username);
    if(!user) return;
    var email = user.email || (user.username + "@" + DOMINIOS[0]);
    try {
      await auth.sendPasswordResetEmail(email);
      registrar("Link de redefinição enviado", user.username);
      toast("Link de redefinição enviado para " + email + ".");
    } catch(err){
      toast(msgAuth(err));
    }
  }

  async function mudarStatus(username){
    if(!ehAdministrativo()) return;
    if(ehVoce(username)){ toast("Você não pode inativar o próprio acesso."); return; }
    var user = acharUsuario(username);
    if(!user) return;
    var antes = user.active;
    user.active = (user.active === false);
    var ok = await salvarUsuarios();
    if(!ok){ user.active = antes; render(); return; }
    registrar(user.active ? "Acesso ativado" : "Acesso inativado", user.username);
    toast(user.active ? "Acesso ativado." : "Acesso inativado.");
    render();
  }

  async function mudarPerfil(username){
    if(!ehAdministrativo()) return;
    if(ehVoce(username)){ toast("Você não pode mudar o próprio perfil."); return; }
    var user = acharUsuario(username);
    if(!user) return;
    if(user.uid === ADMIN_UID){ toast("Este é o administrador principal do sistema."); return; }
    var antes = user.canEdit;
    var vira = !ehAdministrativo(user);
    user.canEdit = vira;
    var ok = await salvarUsuarios();
    if(!ok){ user.canEdit = antes; render(); return; }
    registrar("Perfil alterado para " + (vira ? "administrativo" : "colaborativo"), user.username);
    toast(vira ? "Agora é administrativo." : "Agora é colaborativo.");
    render();
  }

  async function sair(){
    state.error = "";
    ["popup-coleta","coleta-dock","popup-atendimento","doca-atendimento","popup-editar"].forEach(function(id){var el=document.getElementById(id);if(el)el.remove();});
        atendimento = { assuntos: [], item: null, minimizados: [] };
    if(ehMinhaSessao()) await finalizarUso(true);
    if(auth) auth.signOut();
  }

  function normalizarItem(i){
    if(!i || !/^\d{6,15}$/.test(String(i.id)) || !/^\d{2}\/\d{2}\/(?:\d{2}|\d{4})$/.test(i.data||"") || nomesAssuntos().indexOf(i.assunto) === -1)throw new Error("Registro inválido");
    var d=i.data.split("/").map(Number),ano=d[2]<100?2000+d[2]:d[2],dt=new Date(Date.UTC(ano,d[1]-1,d[0]));
    if(dt.getUTCFullYear()!==ano || dt.getUTCMonth()!==d[1]-1 || dt.getUTCDate()!==d[0])throw new Error("Data inválida");
    var item={id:String(i.id),data:i.data,assunto:i.assunto,situacao:"NÃO RESPONDIDA"};
    var sit=String(i.situacao||"").trim().toUpperCase();
    if(sit && !/^N[ÃA]O/.test(sit)) item.situacao="RESPONDIDA";
    var nota=String(i.nota===undefined||i.nota===null?"":i.nota).trim();
    if(nota!==""){
      var n=Number(nota);
      if(isNaN(n) || n<0 || n>10)throw new Error("Nota inválida");
      item.nota=n;
    }
    return item;
  }
  async function idsArquivados(){
    var snap = await db.ref("arquivoIds").once("value");
    var mapa = snap.val() || {};
    if(!Object.keys(mapa).length && Object.keys(state.arquivoIndice || {}).length){
      var lista = await carregarArquivo();
      mapa = {};
      lista.forEach(function(r){ mapa[String(r.item.id)] = r.mes; });
    }
    return mapa;
  }

  async function gravarColeta(itens){
    if(!auth.currentUser || !state.currentUser)throw new Error("Entre no app.");
    var limpos=itens.map(normalizarItem);
    var arquivados=await idsArquivados();
    var resumo={ativos:0, arquivoAtualizado:0, ignorados:0};
    for(var i=0;i<limpos.length;i++){
      var item=limpos[i];
      var mesArquivo=arquivados[item.id];
      if(mesArquivo){
        if(ehAdministrativo()){
          var mudanca={situacao:item.situacao};
          if(item.nota!==undefined)mudanca.nota=item.nota;
          await db.ref("arquivo/"+mesArquivo+"/"+item.id).update(mudanca);
          resumo.arquivoAtualizado++;
        } else {
          resumo.ignorados++;
        }
        continue;
      }
      resumo.ativos++;
      await db.ref("coleta/"+item.id).transaction(function(atual){
        if(!atual)return item;
        atual.situacao=item.situacao;
        if(item.nota!==undefined)atual.nota=item.nota;
        return atual;
      },undefined,false);
    }
    if(resumo.arquivoAtualizado)state.arquivoCache=null;
    return resumo;
  }

  iniciar();

})();
</script>
