<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA Detran-SP</title>
<link rel="icon" type="image/png" href="RA.png">
<link rel="shortcut icon" type="image/png" href="RA.png">
<link rel="apple-touch-icon" href="RA.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#239b4e;
    --amber:#b0c628;
    --rust:#c0392b;
    --gold:#239b4e;
    --olive:#235e9b;
    --olive-deep:#1a1c21;
    --olive-soft:#3a7bc4;
    --paper:#22242a;
    --surface:#2a2d34;
    --ink:#e3e2e0;
    --ink-soft:#a3a89a;
    --line:#3a3d44;
    --line-strong:#4a4e56;
    --amber-deep:#c9d94a;
    --rust-soft:#3a2422;
    --sage-soft:#1f3a12;
    --amber-soft:#333a14;
    --font-display:'Archivo',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-0.02em; margin:0;}
  button{font-family:inherit;}

  .mark{display:block; line-height:0;}
  .mark-logo{
    display:block; height:52px; width:auto; max-width:100%;
    border-radius:26px;
  }
  .trilho .mark-logo{height:44px; border-radius:22px;}
  @media (max-width:860px){
    .entrada-arte .mark-logo{height:44px; border-radius:22px;}
  }

  .entrada{display:grid; grid-template-columns:minmax(0,44%) minmax(0,56%); min-height:100vh;}
  .entrada-arte{
    background:var(--olive-deep); color:#F2F0E4; padding:44px 46px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between; gap:28px;
  }
  .entrada-arte::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(110,180,1,0.10) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .arte-topo{position:relative; z-index:1;}
  .arte-titulo{font-family:var(--font-display); font-weight:700; font-size:clamp(38px,4.4vw,60px); line-height:0.98; letter-spacing:-0.035em; margin:0; color:#F2F0E4;}
  .arte-titulo span{display:block; color:var(--sage);}

  .entrada-form{display:flex; align-items:center; justify-content:center; padding:40px 28px; background:var(--paper);}
  .form-bloco{width:100%; max-width:420px;}
  .form-bloco h1{font-size:27px; margin-bottom:22px; color:var(--ink);}

  @media (max-width:860px){
    .entrada{grid-template-columns:1fr;}
    .entrada-arte{padding:26px 22px 30px; gap:18px;}
    .arte-titulo{font-size:34px;}
  }

  .campo{margin-bottom:16px;}
  .campo label{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:6px;}
  .campo-linha{position:relative;}
  input[type="text"], input[type="password"], input[type="email"], select, textarea{
    width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); font-family:var(--font-body); font-size:14.5px;
    outline:none; transition:border-color .14s, box-shadow .14s;
  }
  input::placeholder{color:#6D7264;}
  input:focus, select:focus, textarea:focus{border-color:var(--olive); box-shadow:0 0 0 3px rgba(35,94,155,0.22);}
  select{
    appearance:none; padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a3a89a' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .olho{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:6px; color:var(--ink-soft);
    display:flex; align-items:center; border-radius:6px;
  }
  .olho:hover{color:var(--olive);}
  :focus-visible{outline:2px solid var(--olive); outline-offset:2px;}

  .btn{
    border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:14.5px;
    padding:11px 18px; transition:background .14s, border-color .14s, color .14s;
  }
  .btn-principal{background:var(--amber); color:#1a1c05; width:100%;}
  .btn-principal:hover{background:var(--amber-deep); color:#0f1003;}
  .btn-principal:disabled{opacity:.55; cursor:not-allowed;}
  .btn-neutro{background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);}
  .btn-neutro:hover{border-color:var(--olive); color:var(--olive-soft);}
  .btn-neutro:disabled{opacity:.55; cursor:not-allowed;}
  .btn-risco{background:var(--surface); border:1px solid var(--rust); color:#e77362;}
  .btn-risco:hover{background:var(--rust-soft);}
  .btn-sage{background:var(--sage-soft); border:1px solid var(--sage); color:#8fe23d;}
  .btn-sage:hover{background:var(--sage); color:#0f1a00;}
  .btn-mini{padding:6px 11px; font-size:12.5px; border-radius:7px;}
  .btn-largo{width:100%;}

  .link{
    background:none; border:none; color:var(--olive-soft); font-size:13.5px; font-weight:500;
    cursor:pointer; padding:6px 2px; text-decoration:underline; text-underline-offset:3px;
  }
  .link:hover{color:var(--amber);}
  .rodape-form{margin-top:20px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; align-items:center; gap:12px; flex-wrap:wrap;}

  .aviso{border-radius:8px; padding:11px 13px; font-size:13.5px; margin-bottom:16px;}
  .aviso-erro{background:var(--rust-soft); border:1px solid #6b3129; color:#f2a99b;}
  .aviso-ok{background:var(--sage-soft); border:1px solid var(--sage); color:#a3e666;}

  .passo-config{font-size:13.5px; color:var(--ink-soft); padding-left:18px; margin:0 0 18px;}
  .passo-config li{margin-bottom:7px;}
  .passo-config code{font-family:var(--font-mono); font-size:12.5px; color:var(--amber-deep);}

  .shell{min-height:100vh; width:100%;}

  .trilho{
    position:fixed; top:0; left:0; z-index:40;
    width:236px; height:100vh;
    background:var(--olive-deep); color:#EDEBDC; padding:22px 16px;
    display:flex; flex-direction:column; gap:26px;
    transform:translateX(-100%); transition:transform .18s ease;
    box-shadow:0 0 34px rgba(0,0,0,0.45);
  }
  .shell.aberto .trilho{transform:translateX(0);}
  .fundo-trilho{position:fixed; inset:0; background:rgba(10,11,13,0.55); z-index:35;}
  .trilho-nav{display:flex; flex-direction:column; gap:3px;}
  .trilho-nav button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:#B7BBA6; padding:10px 12px; border-radius:8px;
    font-size:14px; font-weight:500; cursor:pointer;
  }
  .trilho-nav button:hover{background:rgba(242,240,228,0.09); color:#F2F0E4;}
  .trilho-nav button.on{background:var(--amber); color:#1a1c05; font-weight:600;}
  .trilho-nav svg{width:17px; height:17px; flex-shrink:0;}

  .principal{display:flex; flex-direction:column; min-width:0; width:100%;}
  .cabecalho{
    display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px;
    padding:14px 26px; background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:12;
  }
  .btn-trilho{
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink);
    border-radius:8px; padding:9px 10px; display:flex; align-items:center; cursor:pointer;
  }
  .btn-trilho:hover{border-color:var(--olive); color:var(--olive-soft);}
  .btn-trilho svg{width:22px; height:16px;}
  .acoes-topo{display:flex; align-items:center; gap:8px;}

  .uso-campo{
    justify-self:center; min-width:min(420px,100%); max-width:560px; text-align:center;
    background:var(--paper); border:2px dashed var(--sage); border-radius:12px; padding:10px 26px;
  }
  .uso-campo .rotulo{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); line-height:1.4;}
  .uso-campo .nome{font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1.25; color:#8fe23d; word-break:break-word;}
  .uso-campo.ocupado{border-color:var(--rust); background:rgba(58,36,34,0.45);}
  .uso-campo.ocupado .nome{color:#ef8474;}
  .uso-campo.livre .nome{letter-spacing:.08em;}

  .conteudo{padding:26px 30px 70px; max-width:1080px; width:100%; margin:0 auto;}
  @media (max-width:820px){
    .cabecalho{padding:12px 14px; gap:10px;}
    .uso-campo{min-width:0; padding:8px 12px;}
    .uso-campo .nome{font-size:19px;}
    .uso-campo .rotulo{font-size:10.5px;}
    .conteudo{padding-left:18px; padding-right:18px;}
  }

  .cartao{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-bottom:22px;}
  .cartao h2{font-size:17px; margin-bottom:18px; color:var(--ink);}
  .grade-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
  .grade-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
  @media (max-width:700px){ .grade-3,.grade-2{grid-template-columns:1fr;} }

  .controle{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:34px 12px 26px;
  }
  .btn-uso{
    font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.07em;
    padding:16px 54px; border-radius:11px; border:none; cursor:pointer;
    transition:background .14s, color .14s;
  }
  .btn-uso-iniciar{background:var(--sage); color:#06210f;}
  .btn-uso-iniciar:hover{background:#2ab85c;}
  .btn-uso-finalizar{background:var(--rust); color:#fff;}
  .btn-uso-finalizar:hover{background:#d9503f;}
  .btn-uso-bloqueado{background:#383b42; color:#767b68; cursor:not-allowed;}
  .btn-uso:disabled{cursor:not-allowed;}
  .controle-estado{font-size:13.5px; color:var(--ink-soft); max-width:46ch;}
  .controle-estado strong{color:var(--ink);}

  .credencial{
    border:1px solid var(--gold); background:var(--amber-soft); border-radius:11px;
    padding:16px 18px; margin-top:18px;
  }
  .credencial h3{font-family:var(--font-display); font-size:15px; margin-bottom:10px; color:var(--ink);}
  .cred-linha{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 0; font-size:13.5px; color:var(--ink-soft);}
  .cred-linha b{font-family:var(--font-mono); font-weight:600; font-size:14.5px; color:var(--amber-deep); word-break:break-all; text-align:right;}

  .rolagem{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:700px;}
  th{
    text-align:left; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    padding:0 10px 10px; border-bottom:1px solid var(--line-strong);
  }
  td{padding:13px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);}
  .acoes{display:flex; gap:7px; flex-wrap:wrap;}
  .voce{font-size:12.5px; color:var(--ink-soft);}
  .tabela-uso{min-width:560px;}

  .selo{display:inline-flex; align-items:center; gap:5px; border-radius:100px; padding:3px 10px; font-size:12px; font-weight:500; white-space:nowrap;}
  .selo-ativo{background:var(--sage-soft); color:#a3e666; border:1px solid var(--sage);}
  .selo-inativo{background:var(--rust-soft); color:#f2a99b; border:1px solid #6b3129;}
  .selo-temp{background:var(--amber-soft); color:var(--amber-deep); border:1px solid var(--gold); margin-left:6px;}
  .selo-edicao{background:#2a3020; color:#c3d19a; border:1px solid var(--olive-soft);}
  .selo-leitura{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line-strong);}
  .selo-inicio{background:var(--sage-soft); color:#a3e666; border:1px solid var(--sage);}
  .selo-fim{background:var(--rust-soft); color:#f2a99b; border:1px solid #6b3129;}

  .vazio{padding:34px 12px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  .linha-dado{display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; color:var(--ink);}
  .linha-dado:last-child{border-bottom:none;}
  .linha-dado span:first-child{color:var(--ink-soft);}

  .registro{list-style:none; margin:0; padding:0;}
  .registro li{padding:12px 0; border-bottom:1px solid var(--line);}
  .registro li:last-child{border-bottom:none;}
  .registro-topo{font-size:14px; font-weight:500; color:var(--ink);}
  .registro-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  .carregando{display:flex; align-items:center; justify-content:center; gap:10px; min-height:100vh; color:var(--ink-soft); font-size:14px;}
  .giro{width:16px; height:16px; border-radius:50%; border:2px solid var(--line-strong); border-top-color:var(--olive); animation:gira .8s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .giro{animation:none;} .trilho{transition:none;} }

  .aviso-flutuante{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); padding:11px 18px; border-radius:9px;
    font-size:13.5px; z-index:100; box-shadow:0 12px 28px rgba(0,0,0,0.5); max-width:calc(100% - 32px); text-align:center;
  }
</style>
</head>

 while((m=re.exec(texto))!==null){
   if(m[2].trim().length>3 && !enviados.has(m[1])){
     pendentes.set(m[1],{id:m[1],data:m[3],assunto:categoria(m[2])});
   }
 }
}
function enviar(){
 if(!conectado || !janela || janela.closed || parado)return;
 if(!lote && pendentes.size)lote={type:"RA_BATCH",canal:canal,seq:++seq,itens:Array.from(pendentes.values()).slice(0,50)};
 if(lote)janela.postMessage(lote,destino.origin);
}
function conectar(){
 var u=new URL(APP_URL);u.searchParams.set("ra_bridge","1");
 u.hash=new URLSearchParams({canal:canal,origem:location.origin}).toString();
 janela=window.open(u.href,"ra_bridge_"+canal,"width=1050,height=760");
 conectado=false;parado=false;
 status(janela?"Entre no app e clique em AUTORIZAR COLETA na janela aberta.":"Pop-up bloqueado. Permita pop-ups e clique novamente.");
}
function receber(e){
 var d=e.data;
 if(e.origin!==destino.origin || e.source!==janela || !d || d.canal!==canal)return;
 if(d.type==="RA_READY"){conectado=true;parado=false;varrer();status("Conectado. Enviando registros…");enviar();}
 if(d.type==="RA_ACK" && lote && d.seq===lote.seq){
   lote.itens.forEach(function(i){enviados.add(i.id);pendentes.delete(i.id);});lote=null;
   status(enviados.size+" registro(s) confirmado(s) no Firebase. Navegue para a próxima página.");enviar();
 }
 if(d.type==="RA_ERROR"){parado=true;status("Envio pausado: "+d.message+" Clique em Tentar novamente.");}
}
window.addEventListener("message",receber);
botao("Conectar ao app",conectar);
botao("Coletar / Tentar novamente",function(){parado=false;varrer();enviar();if(!conectado)status("Clique primeiro em Conectar ao app.");});
botao("Fechar coletor",function(){window.__raAutoCleanup();});
document.body.appendChild(caixa);
var timer=setInterval(function(){
 if(janela && janela.closed){conectado=false;status("Janela do app fechada. Conecte novamente.");}
 varrer();enviar();
},3000);
window.__raAutoCleanup=function(){clearInterval(timer);window.removeEventListener("message",receber);caixa.remove();delete window.__raAutoCleanup;};
status("Clique em Conectar ao app. Não é preciso copiar os dados.");
})();

  var IC_REGISTRO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="16" y2="13"/><line x1="9" y1="17" x2="14" y2="17"/></svg>';
  var IC_INICIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.4 12 4l9 7.4"/><path d="M5 10v9.5a.5.5 0 0 0 .5.5H10v-6h4v6h4.5a.5.5 0 0 0 .5-.5V10"/></svg>';

      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.7 10.7 0 0 1 12 19.5c-6.5 0-10.5-6.5-10.5-6.5a20 20 0 0 1 4.9-5.6M9.9 4.8A10.4 10.4 0 0 1 12 4.5c6.5 0 10.5 6.5 10.5 6.5a20 20 0 0 1-3.1 4.2M14.1 14.1A3 3 0 1 1 9.9 9.9"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  }

  function marca(){
    return '<div class="mark">' +
      '<img class="mark-logo" src="' + LOGO_URL + '" alt="Reclame Aqui Detran-SP" decoding="async">' +
    '</div>';
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function digitos(v){ return (v||"").replace(/\D/g,""); }

  function formatCPF(v){
    var d = digitos(v).slice(0,11);
    if(d.length > 9) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
    if(d.length > 6) return d.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
    if(d.length > 3) return d.replace(/(\d{3})(\d{1,3})/, "$1.$2");
    return d;
  }

  function gerarSenha(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var out = "";
    for(var i=0;i<10;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }

  function dataHora(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
  }

  function soData(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("pt-BR");
  }

  function soHora(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  }

  function autor(){
    return (state.currentUser && state.currentUser.username) || "Sistema";
  }

  function toArray(val){
    if(!val) return [];
    return Array.isArray(val) ? val.filter(Boolean) : Object.keys(val).map(function(k){ return val[k]; });
  }

  function toast(msg){
    var t = document.createElement("div");
    t.className = "aviso-flutuante";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3200);
  }

  function copiar(texto, msg){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texto).then(function(){ toast(msg); }, function(){ copiaManual(texto, msg); });
    } else copiaManual(texto, msg);
  }

  function copiaManual(texto, msg){
    var ta = document.createElement("textarea");
    ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg); }
    catch(e){ toast("Copie manualmente: " + texto); }
    ta.remove();
  }

  function usuarioDoEmail(email){
    return String(email||"").split("@")[0];
  }

  function emailsCandidatos(entrada){
    var v = String(entrada||"").trim().toLowerCase();
    if(!v) return [];
    if(v.indexOf("@") !== -1) return [v];
    return DOMINIOS.map(function(d){ return v + "@" + d; });
  }

  function msgAuth(err){
    var c = (err && err.code) || "";
    switch(c){
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found":
      case "auth/invalid-email":
        return "Usuário ou senha não conferem.";
      case "auth/user-disabled":
        return "Esta conta está desativada no Firebase Authentication.";
      case "auth/too-many-requests":
        return "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.";
      case "auth/network-request-failed":
        return "Sem conexão com o Firebase. Verifique a rede.";
      case "auth/email-already-in-use":
        return "Já existe uma conta no Authentication com esse e-mail.";
      case "auth/weak-password":
        return "A senha precisa de pelo menos 6 caracteres.";
      case "auth/requires-recent-login":
        return "Por segurança, saia e entre de novo antes de trocar a senha.";
      case "auth/operation-not-allowed":
        return "Ative o método E-mail/senha em Authentication → Sign-in method.";
      case "auth/invalid-api-key":
      case "auth/configuration-not-found":
        return "Configuração do Firebase incompleta (apiKey ou authDomain).";
      default:
        return "Não foi possível concluir. " + (c || (err && err.message) || "Erro desconhecido.");
    }
  }

  function msgBanco(err){
    var m = String((err && err.message) || err || "");
    if(m.toUpperCase().indexOf("PERMISSION_DENIED") !== -1){
      return "Sem permissão de gravação no banco. Verifique as regras do Realtime Database.";
    }
    return "Não foi possível salvar no servidor.";
  }

  function ehAdministrativo(user){
    return !!(auth && auth.currentUser && auth.currentUser.uid === ADMIN_UID);
  }

  function nomePerfil(user){
    return ehAdministrativo(user) ? "Administrativo" : "Colaborativo";
  }

  function seloPerfil(user){
    return ehAdministrativo(user)
      ? '<span class="selo selo-edicao">Administrativo</span>'
      : '<span class="selo selo-leitura">Colaborativo</span>';
  }

  function ehVoce(username){
    return !!(state.currentUser &&
      (state.currentUser.username||"").toLowerCase() === (username||"").toLowerCase());
  }

  var refUsuarios = null, refLogs = null, refSessao = null, refUso = null, aoCair = null;

  function ligarBase(){
    if(refUsuarios) return;
    coletaRef=db.ref("coleta");
    coletaRef.on("value",function(snap){
      var v=snap.val()||{};
      state.coleta=Object.keys(v).map(function(k){return v[k];}).sort(function(a,b){return b.id.localeCompare(a.id);});
      if(state.screen==="painel" && !digitandoNoFormulario())render();
    },function(){toast("Coleta sem permissão de leitura. Confira as regras e sua liberação.");});
    refUsuarios = db.ref("usuarios");
    refUsuarios.on("value", aoReceberUsuarios, function(){
      state.booted = true;
      state.error = "Sem permissão de leitura no banco. Verifique as regras do Realtime Database.";
      render();
    });
    refLogs = db.ref("registro");
    refLogs.on("value", function(snap){
      state.logs = toArray(snap.val());
      if(state.screen === "painel" && state.painelAba === "registro") render();
    }, function(){});
    refSessao = db.ref("sessaoAtiva");
    refSessao.on("value", function(snap){
      var valor = snap.val();
      state.sessao = (valor && valor.username) ? valor : null;
      if(state.screen === "painel" && !digitandoNoFormulario()) render();
    }, function(){});
    refUso = db.ref("usoRegistro");
    refUso.on("value", function(snap){
      state.uso = toArray(snap.val()).sort(function(a,b){
        return String(a.em||"").localeCompare(String(b.em||""));
      });
      if(state.screen === "painel" && state.painelAba === "registro") render();
    }, function(){});
  }

  function desligarBase(){
    if(coletaRef){coletaRef.off();coletaRef=null;} state.coleta=[];
    if(refUsuarios){ refUsuarios.off(); refUsuarios = null; }
    if(refLogs){ refLogs.off(); refLogs = null; }
    if(refSessao){ refSessao.off(); refSessao = null; }
    if(refUso){ refUso.off(); refUso = null; }
    state.sessao = null;
    state.uso = [];
  }

  function acharPorUid(uid){
    for(var i=0;i<state.users.length;i++){
      if(state.users[i].uid && state.users[i].uid === uid) return state.users[i];
    }
    return null;
  }

  function acharUsuario(username){
    var u = (username||"").trim().toLowerCase();
    for(var i=0;i<state.users.length;i++){
      if((state.users[i].username||"").toLowerCase() === u) return state.users[i];
    }
    return null;
  }

  function acharPorEmail(email){
    var e = (email||"").toLowerCase();
    if(!e) return null;
    for(var i=0;i<state.users.length;i++){
      if((state.users[i].email||"").toLowerCase() === e) return state.users[i];
    }
    return null;
  }

  function acharCadastro(authUser){
    return acharPorUid(authUser.uid)
        || acharPorEmail(authUser.email)
        || acharUsuario(usuarioDoEmail(authUser.email));
  }

  async function salvarUsuarios(){
    var limpos = state.users.map(function(u){
      var copia = {};
      for(var k in u){ if(k !== "password" && Object.prototype.hasOwnProperty.call(u,k)) copia[k] = u[k]; }
      return copia;
    });
    try {
      if(ehAdministrativo()){
        var permissoes={}; limpos.forEach(function(u){if(u.uid)permissoes[u.uid]={active:u.active!==false};});
        // Permissões no servidor: só o administrador pode alterar esta lista.
        await db.ref().update({usuarios:limpos,acessos:permissoes});
      }else{
        var indice=state.users.findIndex(function(u){return u.uid===auth.currentUser.uid;});
        if(indice<0)throw new Error("Cadastro sem UID");
        var meu=limpos[indice];
        await db.ref("usuarios/"+indice).update({
          lastLogin:meu.lastLogin||"",previousLogin:meu.previousLogin||"",tempPassword:!!meu.tempPassword
        });
      }
      return true;
    }
    catch(e){ toast(msgBanco(e)); return false; }
  }

  async function registrar(evento, alvo){
    state.logs.push({ evento: evento, alvo: alvo || "", por: autor(), em: new Date().toISOString() });
    if(state.logs.length > 200) state.logs = state.logs.slice(-200);
    try { await db.ref("registro").set(state.logs); } catch(e){}
  }

  async function registrarUso(acao){
    var u = state.currentUser;
    if(!u) return;
    try {
      await db.ref("usoRegistro").push({
        username: u.username || "",
        email: u.email || "",
        acao: acao,
        em: new Date().toISOString()
      });
    } catch(e){}
  }

  function digitandoNoFormulario(){
    var ids = ["coleta-dados","novo-usuario","novo-cpf","login-usuario","conta-senha1","senha-nova"];
    for(var i=0;i<ids.length;i++){
      var campo = document.getElementById(ids[i]);
      if(campo && campo.value) return true;
    }
    return false;
  }

  function iniciar(){
    if(!configOk){
      state.booted = true;
      state.screen = "config";
      render();
      return;
    }
    auth.onAuthStateChanged(function(authUser){
      if(authUser){
        state.loginRegistrado = false;
        state.booted = false;
        render();
        ligarBase();
      } else {
        desligarBase();
        state.users = [];
        state.logs = [];
        state.currentUser = null;
        state.screen = "login";
        state.painelAba = "inicio";
        state.trilhoAberto = false;
        state.ultimaCredencial = null;
        state.booted = true;
        render();
      }
    });
  }

  async function aoReceberUsuarios(snap){
    state.users = toArray(snap.val());
    if(ehAdministrativo()){
      var mapa={};state.users.forEach(function(u){if(u.uid)mapa[u.uid]={active:u.active!==false};});
      db.ref("acessos").set(mapa).catch(function(){toast("Falha ao sincronizar permissões.");});
    }
    state.booted = true;

    var authUser = auth.currentUser;
    if(!authUser){ render(); return; }

    var cadastro = acharCadastro(authUser);

    if(!cadastro){
      if(state.users.length === 0){
        if(state.criandoPrimeiro) return;
        state.criandoPrimeiro = true;
        var novo = {
          uid: authUser.uid,
          email: (authUser.email||"").toLowerCase(),
          username: usuarioDoEmail(authUser.email),
          cpf: "",
          active: true,
          canEdit: true,
          tempPassword: false,
          createdAt: new Date().toISOString(),
          lastLogin: "",
          previousLogin: ""
        };
        state.users.push(novo);
        var criou = await salvarUsuarios();
        state.criandoPrimeiro = false;
        if(!criou){ state.users.pop(); render(); return; }
        registrar("Primeiro acesso administrativo criado", novo.username);
        return;
      }
      state.error = "Sua conta foi autenticada, mas não há cadastro para ela neste sistema. Fale com o perfil administrativo.";
      auth.signOut();
      return;
    }

    if(cadastro.active === false){
      state.error = "Este acesso está inativo. Fale com o perfil administrativo.";
      auth.signOut();
      return;
    }

    state.currentUser = cadastro;
    state.error = "";

    if(ehAdministrativo() && (!cadastro.uid || !cadastro.email)){
      cadastro.uid = authUser.uid;
      cadastro.email = (authUser.email||"").toLowerCase();
      salvarUsuarios();
    }

    if(cadastro.tempPassword){
      state.screen = "trocaSenha";
    } else {
      if(!state.loginRegistrado){
        state.loginRegistrado = true;
        cadastro.previousLogin = cadastro.lastLogin || "";
        cadastro.lastLogin = new Date().toISOString();
        salvarUsuarios();
      }
      if(state.screen !== "painel") state.screen = "painel";
    }

    if(digitandoNoFormulario()) return;
    render();
  }

  function render(){
    if(!state.booted){
      app.innerHTML = '<div class="carregando"><span class="giro"></span>Carregando…</div>';
      return;
    }

    var html;
    if(state.screen === "config") html = telaConfig();
    else if(state.screen === "trocaSenha") html = telaTrocaSenha();
    else if(state.screen === "painel") html = telaPainel();
    else html = telaLogin();

    app.innerHTML = html;
    ligarEventos();
  }

  function moldura(conteudo, titulo){
    return '' +
    '<div class="entrada">' +
      '<div class="entrada-arte">' +
        '<div class="arte-topo">' + marca() + '</div>' +
        '<div class="arte-topo">' +
          '<h2 class="arte-titulo">' + titulo + '</h2>' +
        '</div>' +
        '<div class="arte-topo"></div>' +
      '</div>' +
      '<div class="entrada-form">' +
        '<div class="form-bloco">' + conteudo + '</div>' +
      '</div>' +
    '</div>';
  }

  function telaConfig(){
    return moldura(
      '<h1>Falta configurar o Firebase</h1>' +
      '<ol class="passo-config">' +
        '<li>No Firebase, abra <code>Configurações do projeto → Seus apps</code> e copie o objeto <code>firebaseConfig</code>.</li>' +
        '<li>Cole os valores no topo do script deste arquivo.</li>' +
        '<li>Em <code>Authentication → Sign-in method</code>, ative <code>E-mail/senha</code>.</li>' +
        '<li>Crie a primeira conta em <code>Authentication → Usuários</code> e entre com ela.</li>' +
      '</ol>',
      '<span>ReclameAqui</span>Detran-SP'
    );
  }

  function telaLogin(){
    return moldura(
      '<h1>Entrar</h1>' +
      (state.error ? '<div class="aviso aviso-erro">' + esc(state.error) + '</div>' : '') +
      '<form id="form-login">' +
        '<div class="campo">' +
          '<label for="login-usuario">Usuário</label>' +
          '<input type="text" id="login-usuario" autocomplete="username" autocapitalize="none" placeholder="nome.sobrenome">' +
        '</div>' +
        '<div class="campo">' +
          '<label for="login-senha">Senha</label>' +
          '<div class="campo-linha">' +
            '<input type="password" id="login-senha" autocomplete="current-password" placeholder="Sua senha">' +
            '<button type="button" class="olho" id="ver-login" aria-label="Mostrar senha">' + olhoSVG(false) + '</button>' +
          '</div>' +
        '</div>' +
        '<button type="submit" class="btn btn-principal" id="btn-entrar">Entrar</button>' +
      '</form>' +
      '<div class="rodape-form">' +

  async function importarColeta(){
    var campo = document.getElementById("coleta-dados");
    var texto = campo ? campo.value.trim() : "";
    if(!texto){ toast("Cole os dados copiados pelo coletor."); return; }
    var existentes = Object.create(null);
    state.coleta.forEach(function(i){ existentes[i.id] = true; });
    var novos = 0, importar=[];
    texto.split(/\r?\n/).forEach(function(linha, indice){
      if(!linha.trim() || (indice === 0 && /^DATA[;\t,]/i.test(linha))) return;
      var partes = linha.split(linha.indexOf(";") >= 0 ? ";" : "\t");
      var data = (partes[0] || "").trim();
      var id = (partes[1] || "").replace(/\D/g, "");
      var assunto = (partes[2] || "OUTROS").trim().toUpperCase();
      if(id.length >= 6 && !existentes[id]){
        importar.push({data:data, id:id, assunto:assunto});
        existentes[id] = true; novos++;
      }
    });
    try{ await gravarColeta(importar);campo.value="";toast(novos+" registro(s) processado(s).");}
    catch(e){toast("Não foi possível importar: "+e.message);}
  }

  async function alternarUso(){
    if(state.ocupadoUso) return;
    if(ehMinhaSessao()) await finalizarUso(false);
    else await iniciarUso();

  async function iniciarUso(){
    var u = state.currentUser;
    if(!u) return;
    if(state.sessao && state.sessao.username){
      toast("O sistema já está em uso por " + state.sessao.username + ".");
      return;
    }

    state.ocupadoUso = true;
    ocupar("btn-uso", "AGUARDE…");

    var dados = {
      username: u.username || "",
      email: u.email || "",
      uid: u.uid || "",
      em: new Date().toISOString()
    };

    try {
      var res = await db.ref("sessaoAtiva").transaction(function(atual){
        if(atual && atual.username) return;
        return dados;
      });
      if(!res.committed){
        state.ocupadoUso = false;
        toast("Outra pessoa iniciou antes de você.");
        render();
        return;
      }
      aoCair = db.ref("sessaoAtiva").onDisconnect();
      aoCair.remove();
      state.sessao = dados;
      await registrarUso("INICIAR");
      toast("Uso iniciado.");
    } catch(err){
      toast(msgBanco(err));
    }

    state.ocupadoUso = false;
    render();
  }

  async function finalizarUso(silencioso){
    if(!ehMinhaSessao()) return;
    state.ocupadoUso = true;
    if(!silencioso) ocupar("btn-uso", "AGUARDE…");

    try {
      if(aoCair){ try { await aoCair.cancel(); } catch(e){} aoCair = null; }
      await db.ref("sessaoAtiva").remove();
      state.sessao = null;
      await registrarUso("FINALIZAR");
      if(!silencioso) toast("Uso finalizado.");
    } catch(err){
      if(!silencioso) toast(msgBanco(err));
    }

    state.ocupadoUso = false;
    if(!silencioso) render();
  }

  async function entrar(e){
    e.preventDefault();
    state.error = "";

    var nome = (document.getElementById("login-usuario").value || "").trim();
    var senha = document.getElementById("login-senha").value || "";

    if(!nome || !senha){ state.error = "Preencha usuário e senha."; render(); return; }

    ocupar("btn-entrar", "Entrando…");

    try {
      await tentarEntrar(emailsCandidatos(nome), senha);
    } catch(err){
      state.error = msgAuth(err);
      liberar("btn-entrar");
      render();
    }
  }

  async function tentarEntrar(emails, senha){
    var ultimo = null;
    for(var i=0;i<emails.length;i++){
      try {
        await auth.signInWithEmailAndPassword(emails[i], senha);
        return;
      } catch(err){
        ultimo = err;
        var c = err && err.code;
        var eDeCredencial =
          c === "auth/invalid-credential" || c === "auth/user-not-found" ||
          c === "auth/wrong-password"     || c === "auth/invalid-email";
        if(!eDeCredencial) throw err;
      }
    }
    throw ultimo;
  }

  async function pedirRedefinicao(){
    var campo = document.getElementById("login-usuario");
    var nome = ((campo && campo.value) || "").trim();
    if(!nome){
      state.error = "Escreva seu usuário no campo acima para receber o link.";
      render();
      return;
    }
    var emails = emailsCandidatos(nome);
    try {
      await auth.sendPasswordResetEmail(emails[0]);
      state.error = "";
      toast("Se essa conta existir, o link foi enviado para " + emails[0] + ".");
    } catch(err){
      state.error = msgAuth(err);
      render();
    }
  }

  async function salvarSenhaInicial(e){
    e.preventDefault();
    state.error = "";
    var s1 = document.getElementById("senha-nova").value || "";
    var s2 = document.getElementById("senha-confirma").value || "";

    if(s1.length < 6){ state.error = "A senha precisa de pelo menos 6 caracteres."; render(); return; }
    if(s1 !== s2){ state.error = "As duas senhas estão diferentes."; render(); return; }

    try {
      await auth.currentUser.updatePassword(s1);
    } catch(err){
      state.error = msgAuth(err);
      render();
      return;
    }

    var cadastro = state.currentUser;
    cadastro.tempPassword = false;
    cadastro.previousLogin = "";
    cadastro.lastLogin = new Date().toISOString();
    state.loginRegistrado = true;
    await salvarUsuarios();

    toast("Senha definida.");
    state.painelAba = "inicio";
    state.screen = "painel";
    render();
  }

  async function trocarMinhaSenha(){
    var feedback = document.getElementById("troca-feedback");
    var s1 = document.getElementById("conta-senha1").value || "";
    var s2 = document.getElementById("conta-senha2").value || "";

    if(s1.length < 6){ feedback.innerHTML = '<div class="aviso aviso-erro">A senha precisa de pelo menos 6 caracteres.</div>'; return; }
    if(s1 !== s2){ feedback.innerHTML = '<div class="aviso aviso-erro">As duas senhas estão diferentes.</div>'; return; }

    try {
      await auth.currentUser.updatePassword(s1);
    } catch(err){
      feedback.innerHTML = '<div class="aviso aviso-erro">' + esc(msgAuth(err)) + '</div>';
      return;
    }

    if(state.currentUser.tempPassword){
      state.currentUser.tempPassword = false;
      await salvarUsuarios();
    }
    document.getElementById("conta-senha1").value = "";
    document.getElementById("conta-senha2").value = "";
    feedback.innerHTML = '<div class="aviso aviso-ok">Senha alterada.</div>';
    toast("Senha alterada.");
  }

  function appSecundario(){
    try { return firebase.app("criacao"); }
    catch(e){ return firebase.initializeApp(firebaseConfig, "criacao"); }
  }

  async function criarAcesso(e){
    e.preventDefault();
    state.error = "";
    if(!ehAdministrativo()){ state.error = "Só o perfil administrativo pode criar acessos."; render(); return; }

    var nome = (document.getElementById("novo-usuario").value || "").trim().toLowerCase();
    var dominio = document.getElementById("novo-dominio").value;
    var cpf = digitos(document.getElementById("novo-cpf").value || "");
    var perfil = document.getElementById("novo-perfil").value;

    if(!nome){ state.error = "Informe o nome de usuário."; render(); return; }
    if(cpf.length !== 11){ state.error = "O CPF precisa ter 11 dígitos."; render(); return; }

    var email = nome.indexOf("@") !== -1 ? nome : (nome + "@" + dominio);
    if(acharUsuario(usuarioDoEmail(email)) || acharPorEmail(email)){
      state.error = "Já existe um acesso com esse usuário."; render(); return;
    }

    var senha = gerarSenha();
    ocupar("btn-criar", "Criando…");

    var secundario = appSecundario().auth();
    var credencial;
    try {
      credencial = await secundario.createUserWithEmailAndPassword(email, senha);
    } catch(err){
      state.error = msgAuth(err);
      liberar("btn-criar");
      render();
      return;
    }

    state.users.push({
      uid: credencial.user.uid,
      email: email,
      username: usuarioDoEmail(email),
      cpf: cpf,
      active: true,
      canEdit: perfil === "administrativo",
      tempPassword: true,
      createdAt: new Date().toISOString(),
      lastLogin: "",
      previousLogin: ""
    });

    var ok = await salvarUsuarios();
    if(!ok){
      state.users.pop();
      try { await credencial.user.delete(); } catch(e2){}
      try { await secundario.signOut(); } catch(e3){}
      liberar("btn-criar");
      render();
      return;
    }

    try { await secundario.signOut(); } catch(e4){}

    state.ultimaCredencial = {
      username: usuarioDoEmail(email),
      email: email,
      password: senha,
      perfil: perfil === "administrativo" ? "Administrativo" : "Colaborativo"
    };
    registrar("Acesso criado (" + state.ultimaCredencial.perfil + ")", state.ultimaCredencial.username);
    toast("Acesso criado.");
    render();
  }

  function copiarCredencial(){
    var c = state.ultimaCredencial;
    if(!c) return;
    copiar(
      "RA Detran-SP\nUsuário: " + c.username +
      "\nE-mail: " + c.email +
      "\nPerfil: " + c.perfil +
      "\nSenha temporária: " + c.password,
      "Dados copiados."
    );
  }

  async function resetarSenha(username){
    if(!ehAdministrativo()) return;
    var user = acharUsuario(username);
    if(!user) return;
    var email = user.email || (user.username + "@" + DOMINIOS[0]);
    try {
      await auth.sendPasswordResetEmail(email);
      registrar("Link de redefinição enviado", user.username);
      toast("Link de redefinição enviado para " + email + ".");
    } catch(err){
      toast(msgAuth(err));
    }
  }

  async function mudarStatus(username){
    if(!ehAdministrativo()) return;
    if(ehVoce(username)){ toast("Você não pode inativar o próprio acesso."); return; }
    var user = acharUsuario(username);
    if(!user) return;
    var antes = user.active;
    user.active = (user.active === false);
    var ok = await salvarUsuarios();
    if(!ok){ user.active = antes; render(); return; }
    registrar(user.active ? "Acesso ativado" : "Acesso inativado", user.username);
    toast(user.active ? "Acesso ativado." : "Acesso inativado.");
    render();
  }

  async function mudarPerfil(username){
    if(!ehAdministrativo()) return;
    if(ehVoce(username)){ toast("Você não pode mudar o próprio perfil."); return; }
    var user = acharUsuario(username);
    if(!user) return;
    var antes = user.canEdit;
    user.canEdit = (user.canEdit === false);
    var ok = await salvarUsuarios();
    if(!ok){ user.canEdit = antes; render(); return; }
    registrar("Perfil alterado para " + (user.canEdit ? "administrativo" : "colaborativo"), user.username);
    toast(user.canEdit ? "Agora é administrativo." : "Agora é colaborativo.");
    render();
  }

  async function sair(){
    state.error = "";
    if(ehMinhaSessao()) await finalizarUso(true);
    if(auth) auth.signOut();
  }


  var canalPonte=null, origemPonte=null, autorizouPonte=false, uidPonte=null, processando=false;
  try{
    if(new URLSearchParams(location.search).get("ra_bridge")==="1"){
      var p=new URLSearchParams(location.hash.slice(1)), o=new URL(p.get("origem"));
      if(o.protocol==="https:" && (o.hostname==="reclameaqui.com.br" || o.hostname.endsWith(".reclameaqui.com.br")) && /^[a-f0-9]{48}$/.test(p.get("canal")||"")){
        canalPonte=p.get("canal");origemPonte=o.origin;
      }
    }
  }catch(e){}
  function blocoPonte(){
    var h="";
    if(canalPonte)h='<div class="cartao"><h2>Conexão com Reclame Aqui</h2><p>Origem: '+esc(origemPonte)+'</p><p>Autorize apenas se você acabou de clicar em Conectar ao app no coletor. Mantenha esta janela aberta.</p><button class="btn btn-sage" id="autorizar-ponte">AUTORIZAR COLETA</button></div>';
    if(ehAdministrativo())h+='<div class="cartao"><h2>Configuração Firebase • v4</h2><p>Faça backup do banco e das regras atuais. Copie as regras, publique em Realtime Database → Regras e entre novamente com a conta administradora antes dos demais usuários.</p><button class="btn btn-neutro" id="copiar-regras">COPIAR REGRAS DO FIREBASE</button><p>Somente o UID administrador gerencia usuários. Os demais acessos ativos são sincronizados por UID. Cadastros antigos sem UID precisam ser atualizados pelo administrador.</p></div>';
    return h;
  }
  function autorizarPonte(){
    if(!auth.currentUser || !state.currentUser || !window.opener)return toast("Entre na conta e abra esta janela pelo coletor.");
    uidPonte=auth.currentUser.uid;autorizouPonte=true;
    window.opener.postMessage({type:"RA_READY",canal:canalPonte},origemPonte);
    toast("Conexão autorizada. Volte ao Reclame Aqui e mantenha esta janela aberta.");
  }
  function normalizarItem(i){
    var op=["CNH","VEÍCULOS","MULTAS","PORTAL","CREDENCIADOS","ANÁLISE","OUTROS"];
    if(!i || !/^\d{6,15}$/.test(String(i.id)) || !/^\d{2}\/\d{2}\/(?:\d{2}|\d{4})$/.test(i.data||"") || !op.includes(i.assunto))throw new Error("Registro inválido");
    var d=i.data.split("/").map(Number),ano=d[2]<100?2000+d[2]:d[2],dt=new Date(Date.UTC(ano,d[1]-1,d[0]));
    if(dt.getUTCFullYear()!==ano || dt.getUTCMonth()!==d[1]-1 || dt.getUTCDate()!==d[0])throw new Error("Data inválida");
    return {id:String(i.id),data:i.data,assunto:i.assunto};
  }
  async function gravarColeta(itens){
    if(!auth.currentUser || !state.currentUser)throw new Error("Entre no app.");
    var limpos=itens.map(normalizarItem);
    for(var i=0;i<limpos.length;i++){
      var item=limpos[i];
      await db.ref("coleta/"+item.id).transaction(function(atual){return atual || item;},undefined,false);
    }
  }
  window.addEventListener("message",async function(e){
    var d=e.data;
    if(!autorizouPonte || e.source!==window.opener || e.origin!==origemPonte || !d || d.canal!==canalPonte || d.type!=="RA_BATCH")return;
    if(processando)return;
    if(!auth.currentUser || auth.currentUser.uid!==uidPonte){autorizouPonte=false;return;}
    processando=true;
    try{
      if(!Number.isSafeInteger(d.seq) || !Array.isArray(d.itens) || !d.itens.length || d.itens.length>50)throw new Error("Lote inválido");
      await gravarColeta(d.itens);
      e.source.postMessage({type:"RA_ACK",canal:canalPonte,seq:d.seq},origemPonte);
    }catch(err){
      e.source.postMessage({type:"RA_ERROR",canal:canalPonte,message:"Confira login, conexão e regras no app."},origemPonte);
      toast("Coleta não confirmada: "+err.message);
    }finally{processando=false;}
  });

  iniciar();

})();
</script>
