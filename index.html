<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA Detran-SP</title>
<link rel="icon" type="image/png" href="RA.png">
<link rel="shortcut icon" type="image/png" href="RA.png">
<link rel="apple-touch-icon" href="RA.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#239b4e;
    --amber:#b0c628;
    --rust:#c0392b;
    --gold:#239b4e;
    --olive:#235e9b;
    --olive-deep:#1a1c21;
    --olive-soft:#3a7bc4;
    --paper:#22242a;
    --surface:#2a2d34;
    --ink:#e3e2e0;
    --ink-soft:#a3a89a;
    --line:#3a3d44;
    --line-strong:#4a4e56;
    --amber-deep:#c9d94a;
    --rust-soft:#3a2422;
    --sage-soft:#1f3a12;
    --amber-soft:#333a14;
    --font-display:'Archivo',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-0.02em; margin:0;}
  button{font-family:inherit;}

  .mark{display:block; line-height:0;}
  .mark-logo{
    display:block; height:52px; width:auto; max-width:100%;
    border-radius:26px;
  }
  .trilho .mark-logo{height:44px; border-radius:22px;}
  @media (max-width:860px){
    .entrada-arte .mark-logo{height:44px; border-radius:22px;}
  }

  .entrada{display:grid; grid-template-columns:minmax(0,44%) minmax(0,56%); min-height:100vh;}
  .entrada-arte{
    background:var(--olive-deep); color:#F2F0E4; padding:44px 46px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between; gap:28px;
  }
  .entrada-arte::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(110,180,1,0.10) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .arte-topo{position:relative; z-index:1;}
  .arte-titulo{font-family:var(--font-display); font-weight:700; font-size:clamp(38px,4.4vw,60px); line-height:0.98; letter-spacing:-0.035em; margin:0; color:#F2F0E4;}
  .arte-titulo span{display:block; color:var(--sage);}

  .entrada-form{display:flex; align-items:center; justify-content:center; padding:40px 28px; background:var(--paper);}
  .form-bloco{width:100%; max-width:420px;}
  .form-bloco h1{font-size:27px; margin-bottom:22px; color:var(--ink);}

  @media (max-width:860px){
    .entrada{grid-template-columns:1fr;}
    .entrada-arte{padding:26px 22px 30px; gap:18px;}
    .arte-titulo{font-size:34px;}
  }

  .campo{margin-bottom:16px;}
  .campo label{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:6px;}
  .campo-linha{position:relative;}
  input[type="text"], input[type="password"], input[type="email"], select, textarea{
    width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); font-family:var(--font-body); font-size:14.5px;
    outline:none; transition:border-color .14s, box-shadow .14s;
  }
  input::placeholder{color:#6D7264;}
  input:focus, select:focus, textarea:focus{border-color:var(--olive); box-shadow:0 0 0 3px rgba(35,94,155,0.22);}
  select{
    appearance:none; padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a3a89a' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .olho{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:6px; color:var(--ink-soft);
    display:flex; align-items:center; border-radius:6px;
  }
  .olho:hover{color:var(--olive);}
  :focus-visible{outline:2px solid var(--olive); outline-offset:2px;}

  .btn{
    border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:14.5px;
    padding:11px 18px; transition:background .14s, border-color .14s, color .14s;
  }
  .btn-principal{background:var(--amber); color:#1a1c05; width:100%;}
  .btn-principal:hover{background:var(--amber-deep); color:#0f1003;}
  .btn-principal:disabled{opacity:.55; cursor:not-allowed;}
  .btn-neutro{background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);}
  .btn-neutro:hover{border-color:var(--olive); color:var(--olive-soft);}
  .btn-neutro:disabled{opacity:.55; cursor:not-allowed;}
  .btn-risco{background:var(--surface); border:1px solid var(--rust); color:#e77362;}
  .btn-risco:hover{background:var(--rust-soft);}
  .btn-sage{background:var(--sage-soft); border:1px solid var(--sage); color:#8fe23d;}
  .btn-sage:hover{background:var(--sage); color:#0f1a00;}
  .btn-mini{padding:6px 11px; font-size:12.5px; border-radius:7px;}
  .btn-largo{width:100%;}

  .link{
    background:none; border:none; color:var(--olive-soft); font-size:13.5px; font-weight:500;
    cursor:pointer; padding:6px 2px; text-decoration:underline; text-underline-offset:3px;
  }
  .link:hover{color:var(--amber);}
  .rodape-form{margin-top:20px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; align-items:center; gap:12px; flex-wrap:wrap;}

  .aviso{border-radius:8px; padding:11px 13px; font-size:13.5px; margin-bottom:16px;}
  .aviso-erro{background:var(--rust-soft); border:1px solid #6b3129; color:#f2a99b;}
  .aviso-ok{background:var(--sage-soft); border:1px solid var(--sage); color:#a3e666;}

  .shell{min-height:100vh; width:100%;}

  .trilho{
    position:fixed; top:0; left:0; z-index:40;
    width:236px; height:100vh;
    background:var(--olive-deep); color:#EDEBDC; padding:22px 16px;
    display:flex; flex-direction:column; gap:26px;
    transform:translateX(-100%); transition:transform .18s ease;
    box-shadow:0 0 34px rgba(0,0,0,0.45);
  }
  .shell.aberto .trilho{transform:translateX(0);}
  .fundo-trilho{position:fixed; inset:0; background:rgba(10,11,13,0.55); z-index:35;}
  .trilho-nav{display:flex; flex-direction:column; gap:3px;}
  .trilho-nav button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:#B7BBA6; padding:10px 12px; border-radius:8px;
    font-size:14px; font-weight:500; cursor:pointer;
  }
  .trilho-nav button:hover{background:rgba(242,240,228,0.09); color:#F2F0E4;}
  .trilho-nav button.on{background:var(--amber); color:#1a1c05; font-weight:600;}
  .trilho-nav svg{width:17px; height:17px; flex-shrink:0;}

  .principal{display:flex; flex-direction:column; min-width:0; width:100%;}
  .cabecalho{
    display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px;
    padding:14px 26px; background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:12;
  }
  .btn-trilho{
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink);
    border-radius:8px; padding:9px 10px; display:flex; align-items:center; cursor:pointer;
  }
  .btn-trilho:hover{border-color:var(--olive); color:var(--olive-soft);}
  .btn-trilho svg{width:22px; height:16px;}

  .conteudo{padding:26px 30px 70px; max-width:1080px; width:100%; margin: 0 auto;}
  @media (max-width:820px){
    .cabecalho{padding:12px 14px; gap:10px;}
    .conteudo{padding-left:18px; padding-right:18px;}
  }

  .cartao{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-bottom:22px;}
  .cartao h2{font-size:17px; margin-bottom:18px; color:var(--ink);}

  .rolagem{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:700px;}
  th{
    text-align:left; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    padding:0 10px 10px; border-bottom:1px solid var(--line-strong);
  }
  td{padding:13px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);}

  .selo{display:inline-flex; align-items:center; gap:5px; border-radius:100px; padding:3px 10px; font-size:12px; font-weight:500; white-space:nowrap;}
  .selo-ativo{background:var(--sage-soft); color:#a3e666; border:1px solid var(--sage);}
  .vazio{padding:34px 12px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  .carregando{display:flex; align-items:center; justify-content:center; gap:10px; min-height:100vh; color:var(--ink-soft); font-size:14px;}
  .giro{width:16px; height:16px; border-radius:50%; border:2px solid var(--line-strong); border-top-color:var(--olive); animation:gira .8s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}

  .aviso-flutuante{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); padding:11px 18px; border-radius:9px;
    font-size:13.5px; z-index:100; box-shadow:0 12px 28px rgba(0,0,0,0.5); max-width:calc(100% - 32px); text-align:center;
  }
</style>
</head>
<body>
<div id="app"><div class="carregando"><span class="giro"></span>Carregando…</div></div>

<!-- SCRIPT DO COLETOR AUTOMÁTICO (ENVIA PARA O FIREBASE) -->
<script type="text/plain" id="codigo-coletor">
(function(){
"use strict";
if(document.getElementById("ra-coletor")) return;

var CHAVE = "ra_detran_dados_v2";
var itens = [], vistos = Object.create(null);

try { 
  itens = JSON.parse(localStorage.getItem(CHAVE) || "[]") || []; 
} catch(e){ 
  itens = []; 
}

itens.forEach(function(item){ vistos[item.id] = true; });

function salvarLocal(){ 
  try { localStorage.setItem(CHAVE, JSON.stringify(itens)); } catch(e){} 
}

function enviarParaFirebase(novosItens) {
  novosItens.forEach(function(item) {
    var url = "https://reclameaqui-7cf38-default-rtdb.firebaseio.com/coletas/" + item.id + ".json";
    fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(item)
    }).catch(function(err){ console.error("Erro ao sincronizar com Firebase:", err); });
  });
}

function categorizarAssunto(titulo) {
  var t = (titulo || "").toLowerCase();
  if (t.match(/\b(cnh|habilita[çc][ãa]o|carteira|categoria|exame|pdd|renach|biometria)\b/)) return "CNH";
  if (t.match(/\b(ve[íi]culo|carro|moto|placa|transfer[êe]ncia|licenciamento|ipva|crv|crlv|renavam)\b/)) return "VEÍCULOS";
  if (t.match(/\b(multa|infra[çc][ãa]o|pontos|recurso|defesa|autua[çc][ãa]o)\b/)) return "MULTAS";
  if (t.match(/\b(portal|site|sistema|app|aplicativo|login|senha|erro|acesso|cadastro)\b/)) return "PORTAL";
  if (t.match(/\b(credenciad[oa]|autoescola|cfc|m[eé]dic[oa]|psic[óo]log[oa]|despachante|vistoriah)\b/)) return "CREDENCIADOS";
  if (t.match(/\b(an[áa]lise|processo|andamento|pend[êe]ncia|aguardando|prazo|status)\b/)) return "ANÁLISE";
  return "OUTROS";
}

function varrer(){
  var novosItens = [];
  var texto = document.body.innerText || "";
  var reCard = /ID:\s*(\d{6,})[\s\S]*?\n([^\n]+)\n[\s\S]*?(\d{2}\/\d{2}\/\d{2,4})/g;
  var m;

  while((m = reCard.exec(texto)) !== null){
    var id = m[1].trim();
    var titulo = m[2].trim();
    var data = m[3].trim();

    if(titulo.length > 3 && !vistos[id]){
      vistos[id] = true;
      var objetoItem = {
        data: data,
        id: id,
        assunto: categorizarAssunto(titulo),
        titulo: titulo,
        coletadoEm: new Date().toISOString()
      };
      itens.push(objetoItem);
      novosItens.push(objetoItem);
    }
  }

  if(novosItens.length) {
    salvarLocal();
    enviarParaFirebase(novosItens);
  }
  return novosItens.length;
}

function copiar(texto, msg){
  function manual(){
    var ta = document.createElement("textarea");
    ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); status(msg); }
    catch(e){ status("Erro ao copiar."); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){ status(msg); }, manual);
  } else manual();
}

var caixa = document.createElement("div");
caixa.id = "ra-coletor";
caixa.style.cssText = "position:fixed;right:18px;bottom:18px;width:260px;z-index:2147483647;background:#22242a;color:#e3e2e0;font:13px/1.45 system-ui,-apple-system,sans-serif;border:1px solid #4a4e56;border-radius:12px;padding:14px 15px;box-shadow:0 14px 34px rgba(0,0,0,.45)";

function botao(rotulo, principal){
  var b = document.createElement("button");
  b.textContent = rotulo;
  b.style.cssText = "display:block;width:100%;margin-top:7px;padding:8px 10px;border-radius:7px;cursor:pointer;font:600 12.5px system-ui,sans-serif;border:1px solid " +
    (principal ? "#b0c628;background:#b0c628;color:#1a1c05" : "#4a4e56;background:#2a2d34;color:#e3e2e0");
  caixa.appendChild(b);
  return b;
}

var topo = document.createElement("div");
topo.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:8px";
var tit = document.createElement("strong");
tit.textContent = "Coletor Detran (Nuvem)";
var x = document.createElement("button");
x.textContent = "\u00d7";
x.style.cssText = "background:none;border:none;color:#a3a89a;font-size:18px;line-height:1;cursor:pointer";
topo.appendChild(tit); topo.appendChild(x);
caixa.appendChild(topo);

var contador = document.createElement("div");
contador.style.cssText = "font:700 24px system-ui,sans-serif;color:#c9d94a;margin:8px 0 2px";
caixa.appendChild(contador);

var recado = document.createElement("div");
recado.style.cssText = "font-size:11.5px;color:#a3a89a;min-height:28px";
caixa.appendChild(recado);

function status(msg){
  contador.textContent = itens.length + " Registro(s)";
  recado.textContent = msg || "";
}

var bColetar = botao("Coletar esta página", true);
var bCSV     = botao("Copiar como CSV (Excel)");
var bLimpar  = botao("Limpar lista local");

var observador = null, espera = null;
function auto(ativo){
  if(ativo && !observador){
    observador = new MutationObserver(function(){
      clearTimeout(espera);
      espera = setTimeout(function(){
        var n = varrer();
        status(n ? n + " enviado(s) ao painel." : "");
      }, 700);
    });
    observador.observe(document.body, {childList:true, subtree:true});
  } else if(!ativo && observador){
    observador.disconnect(); observador = null;
  }
}

bColetar.onclick = function(){
  var n = varrer();
  status(n ? n + " novo(s) enviado(s) ao app." : "Nenhum dado novo nesta página.");
};

bCSV.onclick = function(){
  if(!itens.length) return status("A lista está vazia.");
  var csv = "DATA;ID;ASSUNTO;TITULO\n" + itens.map(function(i){
    return i.data + ";" + i.id + ";" + i.assunto + ';"' + (i.titulo||"").replace(/"/g, '""') + '"';
  }).join("\n");
  copiar(csv, itens.length + " linha(s) em CSV copiadas!");
};

bLimpar.onclick = function(){
  itens = []; vistos = Object.create(null); salvarLocal();
  status("Lista local zerada.");
};

x.onclick = function(){ auto(false); caixa.remove(); };

document.body.appendChild(caixa);
varrer();
auto(true);
status("Painel sincronizado.");
})();
</script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey:      "AIzaSyANuJqxS0rsYBahW7hvoHCv0MPjoxLQxBw",
    authDomain:  "reclameaqui-7cf38.firebaseapp.com",
    databaseURL: "https://reclameaqui-7cf38-default-rtdb.firebaseio.com",
    projectId:   "reclameaqui-7cf38"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  var state = {
    coletas: [],
    trilhoAberto: false
  };

  var app = document.getElementById("app");
  var refColetas = null;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function toArray(val){
    if(!val) return [];
    return Array.isArray(val) ? val.filter(Boolean) : Object.keys(val).map(function(k){ return val[k]; });
  }

  function ligarBase(){
    if(refColetas) return;
    refColetas = db.ref("coletas");
    refColetas.on("value", function(snap){
      var val = snap.val();
      state.coletas = toArray(val).sort(function(a, b){
        return String(b.coletadoEm || "").localeCompare(String(a.coletadoEm || ""));
      });
      render();
    });
  }

  // FUNÇÃO QUE RENDERIZA A TABELA DE COLETAS NA TELA INICIAL
  function renderTabelaColetas() {
    if (!state.coletas || state.coletas.length === 0) {
      return '<div class="vazio">Nenhuma reclamação coletada até o momento.</div>';
    }

    var linhas = state.coletas.map(function(item) {
      return '<tr>' +
        '<td class="mono">' + esc(item.data) + '</td>' +
        '<td><strong class="mono">' + esc(item.id) + '</strong></td>' +
        '<td><span class="selo selo-ativo">' + esc(item.assunto) + '</span></td>' +
        '<td>' + esc(item.titulo || "-") + '</td>' +
      '</tr>';
    }).join("");

    return '<div class="rolagem">' +
      '<table>' +
        '<thead>' +
          '<tr>' +
            '<th>Data</th>' +
            '<th>ID</th>' +
            '<th>Assunto</th>' +
            '<th>Título / Descrição</th>' +
          '</tr>' +
        '</thead>' +
        '<tbody>' +
          linhas +
        '</tbody>' +
      '</table>' +
    '</div>';
  }

  function render(){
    var html = '<div class="shell">' +
      '<div class="principal">' +
        '<header class="cabecalho">' +
          '<div style="font-weight:700; font-size:18px;">Painel de Coletas Detran-SP</div>' +
        '</header>' +
        '<main class="conteudo">' +
          '<div class="cartao">' +
            '<h2>Reclamações Coletadas em Tempo Real (' + state.coletas.length + ')</h2>' +
            renderTabelaColetas() +
          '</div>' +
        '</main>' +
      '</div>' +
    '</div>';

    app.innerHTML = html;
  }

  ligarBase();
})();
</script>
</body>
</html>
