<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA Detran-SP</title>
<link rel="icon" type="image/png" href="RA.png">
<link rel="shortcut icon" type="image/png" href="RA.png">
<link rel="apple-touch-icon" href="RA.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#239b4e;
    --amber:#b0c628;
    --rust:#c0392b;
    --gold:#239b4e;
    --olive:#235e9b;
    --olive-deep:#1a1c21;
    --olive-soft:#3a7bc4;
    --paper:#22242a;
    --surface:#2a2d34;
    --ink:#e3e2e0;
    --ink-soft:#a3a89a;
    --line:#3a3d44;
    --line-strong:#4a4e56;
    --amber-deep:#c9d94a;
    --rust-soft:#3a2422;
    --sage-soft:#1f3a12;
    --amber-soft:#333a14;
    --font-display:'Archivo',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-0.02em; margin:0;}
  button{font-family:inherit;}

  .mark{display:block; line-height:0;}
  .mark-logo{
    display:block; height:52px; width:auto; max-width:100%;
    border-radius:26px;
  }
  @media (max-width:860px){
    .entrada-arte .mark-logo{height:44px; border-radius:22px;}
  }

  .entrada{display:grid; grid-template-columns:minmax(0,44%) minmax(0,56%); min-height:100vh;}
  .entrada-arte{
    background:var(--olive-deep); color:#F2F0E4; padding:44px 46px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:space-between; gap:28px;
  }
  .entrada-arte::after{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(110,180,1,0.10) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .arte-topo{position:relative; z-index:1;}
  .arte-titulo{font-family:var(--font-display); font-weight:700; font-size:clamp(38px,4.4vw,60px); line-height:0.98; letter-spacing:-0.035em; margin:0; color:#F2F0E4;}
  .arte-titulo span{display:block; color:var(--sage);}

  .entrada-form{display:flex; align-items:center; justify-content:center; padding:40px 28px; background:var(--paper);}
  .form-bloco{width:100%; max-width:420px;}
  .form-bloco h1{font-size:27px; margin-bottom:22px; color:var(--ink);}

  @media (max-width:860px){
    .entrada{grid-template-columns:1fr;}
    .entrada-arte{padding:26px 22px 30px; gap:18px;}
    .arte-titulo{font-size:34px;}
  }

  .campo{margin-bottom:16px;}
  .campo label{display:block; font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:6px;}
  .campo-linha{position:relative;}
  input[type="text"], input[type="password"], input[type="email"], input[type="date"], select, textarea{
    width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); font-family:var(--font-body); font-size:14.5px;
    outline:none; transition:border-color .14s, box-shadow .14s;
  }
  input::placeholder{color:#6D7264;}
  input:focus, select:focus, textarea:focus{border-color:var(--olive); box-shadow:0 0 0 3px rgba(35,94,155,0.22);}
  select{
    appearance:none; padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a3a89a' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .olho{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:6px; color:var(--ink-soft);
    display:flex; align-items:center; border-radius:6px;
  }
  .olho:hover{color:var(--olive);}
  :focus-visible{outline:2px solid var(--olive); outline-offset:2px;}

  .btn{
    border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:14.5px;
    padding:11px 18px; transition:background .14s, border-color .14s, color .14s;
  }
  .btn-principal{background:var(--amber); color:#1a1c05; width:100%;}
  .btn-principal:hover{background:var(--amber-deep); color:#0f1003;}
  .btn-principal:disabled{opacity:.55; cursor:not-allowed;}
  .btn-neutro{background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);}
  .btn-neutro:hover{border-color:var(--olive); color:var(--olive-soft);}
  .btn-neutro:disabled{opacity:.55; cursor:not-allowed;}
  .btn-risco{background:var(--surface); border:1px solid var(--rust); color:#e77362;}
  .btn-risco:hover{background:var(--rust-soft);}
  .btn-sage{background:var(--sage-soft); border:1px solid var(--sage); color:#8fe23d;}
  .btn-sage:hover{background:var(--sage); color:#0f1a00;}
  .btn-mini{padding:6px 11px; font-size:12.5px; border-radius:7px;}
  .btn-largo{width:100%;}

  .link{
    background:none; border:none; color:var(--olive-soft); font-size:13.5px; font-weight:500;
    cursor:pointer; padding:6px 2px; text-decoration:underline; text-underline-offset:3px;
  }
  .link:hover{color:var(--amber);}
  .rodape-form{margin-top:20px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; align-items:center; gap:12px; flex-wrap:wrap;}

  .aviso{border-radius:8px; padding:11px 13px; font-size:13.5px; margin-bottom:16px;}
  .aviso-erro{background:var(--rust-soft); border:1px solid #6b3129; color:#f2a99b;}
  .aviso-ok{background:var(--sage-soft); border:1px solid var(--sage); color:#a3e666;}

  .passo-config{font-size:13.5px; color:var(--ink-soft); padding-left:18px; margin:0 0 18px;}
  .passo-config li{margin-bottom:7px;}
  .passo-config code{font-family:var(--font-mono); font-size:12.5px; color:var(--amber-deep);}

  .shell{
    display:grid; grid-template-columns:0 minmax(0,1fr); min-height:100vh; width:100%;
    transition:grid-template-columns .18s ease;
  }
  .shell.aberto{grid-template-columns:236px minmax(0,1fr);}
  .trilho{
    position:sticky; top:0; height:100vh; overflow:hidden; min-width:0;
    background:var(--olive-deep); color:#EDEBDC; padding:22px 16px;
    display:flex; flex-direction:column; gap:22px; border-right:1px solid var(--line);
    transition:padding .18s ease;
  }
  .shell:not(.aberto) .trilho{padding:0; border-right:0; width:0;}
  .trilho-nav{display:flex; flex-direction:column; gap:3px; width:204px;}
  .trilho-nav button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:#B7BBA6; padding:10px 12px; border-radius:8px;
    font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .trilho-nav button:hover{background:rgba(242,240,228,0.09); color:#F2F0E4;}
  .trilho-nav button.on{background:var(--amber); color:#1a1c05; font-weight:600;}
  .trilho-nav svg{width:17px; height:17px; flex-shrink:0;}
  @media (max-width:820px){
    .shell.aberto{grid-template-columns:200px minmax(0,1fr);}
    .trilho-nav{width:168px;}
  }

  .principal{display:flex; flex-direction:column; min-width:0; width:100%;}
  .cabecalho{
    display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; align-items:center; gap:14px;
    padding:12px 26px; background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:12;
  }
  .marca-topo{display:flex; align-items:center; line-height:0;}
  .marca-topo img{height:38px; width:auto; border-radius:19px; display:block;}
  .btn-trilho{
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink);
    border-radius:8px; padding:9px 10px; display:flex; align-items:center; cursor:pointer;
  }
  .btn-trilho:hover{border-color:var(--olive); color:var(--olive-soft);}
  .btn-trilho svg{width:22px; height:16px;}
  .acoes-topo{display:flex; align-items:center; gap:8px;}

  .uso-campo{
    justify-self:center; min-width:min(380px,100%); max-width:520px; text-align:center;
    background:var(--paper); border:2px dashed var(--sage); border-radius:12px; padding:10px 26px;
  }
  .uso-campo .rotulo{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); line-height:1.4;}
  .uso-campo .nome{font-family:var(--font-display); font-weight:700; font-size:24px; line-height:1.25; color:#8fe23d; word-break:break-word;}
  .uso-campo.ocupado{border-color:var(--rust); background:rgba(58,36,34,0.45);}
  .uso-campo.ocupado .nome{color:#ef8474;}
  .uso-campo.livre .nome{letter-spacing:.08em;}

  .conteudo{padding:26px 30px 70px; max-width:1180px; width:100%; margin:0 auto;}
  @media (max-width:820px){
    .cabecalho{padding:10px 14px; gap:10px;}
    .marca-topo img{height:30px; border-radius:15px;}
    .uso-campo{min-width:0; padding:8px 12px;}
    .uso-campo .nome{font-size:19px;}
    .uso-campo .rotulo{font-size:10.5px;}
    .conteudo{padding-left:18px; padding-right:18px;}
  }

  .cartao{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px 24px; margin-bottom:22px;}
  .cartao h2{font-size:17px; margin-bottom:18px; color:var(--ink);}
  .grade-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px;}
  .grade-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
  @media (max-width:700px){ .grade-3,.grade-2{grid-template-columns:1fr;} }

  .inicio-grade{display:grid; grid-template-columns:minmax(240px,300px) minmax(0,1fr); gap:24px; align-items:center;}
  @media (max-width:820px){ .inicio-grade{grid-template-columns:1fr;} }

  .controle{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:18px 6px;
  }
  .btn-uso{
    font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.07em;
    padding:16px 42px; border-radius:11px; border:none; cursor:pointer; width:100%;
    transition:background .14s, color .14s;
  }
  .btn-uso-iniciar{background:var(--sage); color:#06210f;}
  .btn-uso-iniciar:hover{background:#2ab85c;}
  .btn-uso-finalizar{background:var(--rust); color:#fff;}
  .btn-uso-finalizar:hover{background:#d9503f;}
  .btn-uso-bloqueado{background:#383b42; color:#767b68; cursor:not-allowed;}
  .btn-uso:disabled{cursor:not-allowed;}
  .controle-estado{font-size:13.5px; color:var(--ink-soft); max-width:40ch;}
  .controle-estado strong{color:var(--ink);}
  .btn-mais{
    width:46px; height:46px; border-radius:50%; cursor:pointer;
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);
    font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .btn-mais:hover{border-color:var(--amber); color:var(--amber-deep);}

  .painel-totais.quatro{grid-template-columns:repeat(4,minmax(0,1fr));}
  @media (max-width:820px){ .painel-totais.quatro{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .barra-linha{display:grid; grid-template-columns:128px minmax(0,1fr) 52px; align-items:center; gap:12px; margin-bottom:10px;}
  .barra-linha:last-child{margin-bottom:0;}
  .barra-rotulo{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barra-trilho{height:12px; border-radius:100px; background:var(--paper); border:1px solid var(--line); overflow:hidden;}
  .barra-cheia{height:100%; background:var(--amber); border-radius:100px;}
  .barra-cheia.verde{background:var(--sage);}
  .barra-cheia.vermelha{background:var(--rust);}
  .barra-valor{font-family:var(--font-mono); font-size:13px; text-align:right; color:var(--ink);}
  @media (max-width:520px){ .barra-linha{grid-template-columns:92px minmax(0,1fr) 44px; gap:8px;} }

  .cartao-topo{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .cartao-topo h2{margin-bottom:0;}

  .abas{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .abas-linha{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .aba{
    --acento:var(--line-strong); --acento-texto:#1a1c05;
    background:var(--paper); border:1px solid var(--acento); color:var(--acento);
    padding:9px 16px; border-radius:100px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .aba:hover{filter:brightness(1.12);}
  .aba.on{background:var(--acento); color:var(--acento-texto);}
  .aba-vermelha{--acento:#f3b6ab; --acento-texto:#3a1a14;}
  .aba-verde{--acento:#a8e6a1; --acento-texto:#10331a;}
  .aba-amarela{--acento:#efe08a; --acento-texto:#332b06;}
  .aba-azul{--acento:#a8cdf0; --acento-texto:#0f2437;}
  html.tema-claro .aba{color:var(--ink-soft);}
  html.tema-claro .aba.on{color:var(--acento-texto);}

  .painel-totais{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  @media (max-width:520px){ .painel-totais{grid-template-columns:1fr;} }
  .total-item{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; display:flex; flex-direction:column; gap:6px;
  }
  .total-item span{font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  .total-item b{font-family:var(--font-display); font-size:30px; line-height:1; color:var(--ink);}
  .total-item.destaque{border-color:var(--gold); background:var(--amber-soft);}
  .total-item.destaque b{color:var(--amber-deep);}

  .credencial{
    border:1px solid var(--gold); background:var(--amber-soft); border-radius:11px;
    padding:16px 18px; margin-top:18px;
  }
  .credencial h3{font-family:var(--font-display); font-size:15px; margin-bottom:10px; color:var(--ink);}
  .cred-linha{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 0; font-size:13.5px; color:var(--ink-soft);}
  .cred-linha b{font-family:var(--font-mono); font-weight:600; font-size:14.5px; color:var(--amber-deep); word-break:break-all; text-align:right;}

  .rolagem{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:700px;}
  th{
    text-align:left; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    padding:0 10px 10px; border-bottom:1px solid var(--line-strong);
  }
  td{padding:13px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);}
  .acoes{display:flex; gap:7px; flex-wrap:wrap;}
  .voce{font-size:12.5px; color:var(--ink-soft);}
  .tabela-uso{min-width:560px;}
  .tabela-coleta{min-width:980px;}
  .tabela-coleta select{padding:7px 28px 7px 10px; font-size:13px;}
  .celula-vazia{color:#6D7264;}

  .selo{display:inline-flex; align-items:center; gap:5px; border-radius:100px; padding:3px 10px; font-size:12px; font-weight:500; white-space:nowrap;}
  .selo-ativo{background:var(--sage-soft); color:#a3e666; border:1px solid var(--sage);}
  .selo-inativo{background:var(--rust-soft); color:#f2a99b; border:1px solid #6b3129;}
  .selo-temp{background:var(--amber-soft); color:var(--amber-deep); border:1px solid var(--gold); margin-left:6px;}
  .selo-edicao{background:#2a3020; color:#c3d19a; border:1px solid var(--olive-soft);}
  .selo-leitura{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line-strong);}
  .selo-inicio{background:var(--sage-soft); color:#a3e666; border:1px solid var(--sage);}
  .selo-fim{background:var(--rust-soft); color:#f2a99b; border:1px solid #6b3129;}

  .vazio{padding:34px 12px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  .linha-dado{display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; color:var(--ink);}
  .linha-dado:last-child{border-bottom:none;}
  .linha-dado span:first-child{color:var(--ink-soft);}

  .registro{list-style:none; margin:0; padding:0;}
  .registro li{padding:12px 0; border-bottom:1px solid var(--line);}
  .registro li:last-child{border-bottom:none;}
  .registro-topo{font-size:14px; font-weight:500; color:var(--ink);}
  .registro-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

  .carregando{display:flex; align-items:center; justify-content:center; gap:10px; min-height:100vh; color:var(--ink-soft); font-size:14px;}
  .giro{width:16px; height:16px; border-radius:50%; border:2px solid var(--line-strong); border-top-color:var(--olive); animation:gira .8s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .giro{animation:none;} .shell{transition:none;} }

  .aviso-flutuante{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink); padding:11px 18px; border-radius:9px;
    font-size:13.5px; z-index:100; box-shadow:0 12px 28px rgba(0,0,0,0.5); max-width:calc(100% - 32px); text-align:center;
  }

  #popup-coleta{width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;margin:auto;padding:0;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 24px 80px #0008;}
  #popup-coleta::backdrop{background:rgba(0,0,0,.55);}
  .coleta-topo{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);}
  .coleta-topo h2{font-size:19px;}
  .coleta-miolo{padding:24px;}
  .coleta-miolo p{font-size:14px;color:var(--ink-soft);margin:0 0 18px;}
  #coleta-dados{min-height:200px;resize:vertical;font-family:var(--font-mono);font-size:14px;}
  #coleta-feedback{margin:14px 0 0;font-size:14px;white-space:pre-wrap;}
  #coleta-dock{position:fixed;right:24px;bottom:24px;z-index:100;background:var(--amber);color:#1a1c05;box-shadow:0 8px 24px #0005;}

  #popup-editar{width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;margin:auto;padding:0;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 24px 80px #0008;}
  #popup-editar::backdrop{background:rgba(0,0,0,.55);}
  .editar-topo{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);}
  .editar-topo h2{font-size:19px;}
  .editar-miolo{padding:24px;}
  .editar-fixo{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
  #editar-feedback{margin:14px 0 0;font-size:13.5px;}
  .editar-acoes{display:flex;gap:10px;margin-top:18px;}

  #popup-atendimento{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:90;
    width:min(640px,calc(100vw - 32px)); max-height:calc(100dvh - 32px); overflow:auto;
    margin:0; padding:0; border:1px solid var(--line-strong); border-radius:14px;
    background:var(--surface); color:var(--ink); box-shadow:0 24px 80px #0008;
  }
  .at-topo{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);}
  .at-topo h2{font-size:19px;}
  .at-miolo{padding:24px;}
  .at-id{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .at-id span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .at-id b{font-family:var(--font-mono);font-size:20px;color:var(--amber-deep);}

 var re=/ID:\s*(\d{6,})/g,m,pontos=[];
 while((m=re.exec(texto))!==null)pontos.push({id:m[1],ini:m.index,fim:re.lastIndex});
 for(var k=0;k<pontos.length;k++){
  var ponto=pontos[k];
  if(vistos[ponto.id])continue;
  var antes=texto.slice(Math.max(0,ponto.ini-90),ponto.ini);
  var limite=(k+1<pontos.length)?pontos[k+1].ini:Math.min(texto.length,ponto.fim+900);
  var depois=texto.slice(ponto.fim,limite);
  var linhas=depois.split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length>3;});
  var titulo=linhas.length?linhas[0]:"";
  var data=(depois.match(/(\d{2}\/\d{2}\/\d{2,4})/)||[])[1]||"";
  if(!titulo||!data)continue;
  var situacao="NÃO RESPONDIDA";
  if(!/n[ãa]o\s+respondida/i.test(antes) && /respondida|resolvida|r[ée]plica/i.test(antes))situacao="RESPONDIDA";
  var registro={data:data,id:ponto.id,assunto:categorizarAssunto(titulo),situacao:situacao,titulo:titulo};
  var nota=depois.match(/(\d{1,2})\s*★?\s*(?:n[ãa]o\s+)?voltar[áa]\s+a\s+fazer\s+neg[óo]cio/i);
  if(nota)registro.nota=Number(nota[1]);
  vistos[ponto.id]=true;itens.push(registro);novos++;
 }
 if(novos)salvar();return novos;
}

 else manual();
}

      state.coleta=Object.keys(v).map(function(k){return v[k];}).sort(function(a,b){return b.id.localeCompare(a.id);});
      if(state.screen==="painel" && !digitandoNoFormulario())render();
    },function(){toast("Coleta sem permissão de leitura. Confira as regras e sua liberação.");});
    refUsuarios = db.ref("usuarios");
    refUsuarios.on("value", aoReceberUsuarios, function(){
      state.booted = true;
      state.error = "Sem permissão de leitura no banco. Verifique as regras do Realtime Database.";
      render();
    });
    refLogs = db.ref("registro");
    refLogs.on("value", function(snap){
      state.logs = toArray(snap.val());
      if(state.screen === "painel" && state.painelAba === "registro") render();
    }, function(){});
    refSessao = db.ref("sessaoAtiva");
    refSessao.on("value", function(snap){
      var valor = snap.val();
      state.sessao = (valor && valor.username) ? valor : null;
      if(state.screen === "painel" && !digitandoNoFormulario()) render();
    }, function(){});
    refUso = db.ref("usoRegistro");
    refUso.on("value", function(snap){
      state.uso = toArray(snap.val()).sort(function(a,b){
        return String(a.em||"").localeCompare(String(b.em||""));
      });
      if(state.screen === "painel" && state.painelAba === "registro") render();
    }, function(){});
  }

  function desligarBase(){
    if(coletaRef){coletaRef.off();coletaRef=null;} state.coleta=[];
    if(refListas){refListas.off(); refListas=null;}
    if(refIndice){refIndice.off(); refIndice=null;}
    state.arquivoCache = null;
    definirPeriodoPadrao();
    if(refUsuarios){ refUsuarios.off(); refUsuarios = null; }
    if(refLogs){ refLogs.off(); refLogs = null; }
    if(refSessao){ refSessao.off(); refSessao = null; }
    if(refUso){ refUso.off(); refUso = null; }
    state.sessao = null;
    state.uso = [];
  }

  function acharPorUid(uid){
    for(var i=0;i<state.users.length;i++){
      if(state.users[i].uid && state.users[i].uid === uid) return state.users[i];
    }
    return null;
  }

  function acharUsuario(username){
    var u = (username||"").trim().toLowerCase();
    for(var i=0;i<state.users.length;i++){
      if((state.users[i].username||"").toLowerCase() === u) return state.users[i];
    }
    return null;
  }

  function acharPorEmail(email){
    var e = (email||"").toLowerCase();
    if(!e) return null;
    for(var i=0;i<state.users.length;i++){
      if((state.users[i].email||"").toLowerCase() === e) return state.users[i];
    }
    return null;
  }

  function acharCadastro(authUser){
    return acharPorUid(authUser.uid)
        || acharPorEmail(authUser.email)
        || acharUsuario(usuarioDoEmail(authUser.email));
  }

  async function salvarUsuarios(){
    var limpos = state.users.map(function(u){
      var copia = {};
      for(var k in u){ if(k !== "password" && Object.prototype.hasOwnProperty.call(u,k)) copia[k] = u[k]; }
      return copia;
    });
    try {
      if(ehAdministrativo()){
        var permissoes={}; limpos.forEach(function(u){if(u.uid)permissoes[u.uid]={active:u.active!==false,admin:(u.uid===ADMIN_UID||u.canEdit===true)};});
        await db.ref().update({usuarios:limpos,acessos:permissoes});
      }else{
        var indice=state.users.findIndex(function(u){return u.uid===auth.currentUser.uid;});
        if(indice<0)throw new Error("Cadastro sem UID");
        var meu=limpos[indice];
        await db.ref("usuarios/"+indice).update({
          lastLogin:meu.lastLogin||"",previousLogin:meu.previousLogin||"",tempPassword:!!meu.tempPassword
        });
      }
      return true;
    }
    catch(e){ toast(msgBanco(e)); return false; }
  }

  async function registrar(evento, alvo){
    state.logs.push({ evento: evento, alvo: alvo || "", por: autor(), em: new Date().toISOString() });
    if(state.logs.length > 200) state.logs = state.logs.slice(-200);
    try { await db.ref("registro").set(state.logs); } catch(e){}
  }

  async function registrarUso(acao){
    var u = state.currentUser;
    if(!u) return;
    try {
      await db.ref("usoRegistro").push({
        username: u.username || "",
        nome: nomeExibido(u),
        email: u.email || "",
        acao: acao,
        em: new Date().toISOString()
      });
    } catch(e){}
  }

  function digitandoNoFormulario(){
    if(state.painelAba === "listas" && document.getElementById("area-listas")) return true;
    var ids = ["base-dados","editar-nome","editar-cpf","coleta-dados","novo-nome","novo-usuario","novo-cpf","login-usuario","conta-senha1","senha-nova"];
    for(var i=0;i<ids.length;i++){
      var campo = document.getElementById(ids[i]);
      if(campo && campo.value) return true;
    }
    return false;
  }

  function iniciar(){
    carregarTema();
    definirPeriodoPadrao();
    if(!configOk){
      state.booted = true;
      state.screen = "config";
      render();
      return;
    }
    auth.onAuthStateChanged(function(authUser){
      if(authUser){
        state.loginRegistrado = false;
        state.booted = false;
        render();
        ligarBase();
      } else {
        desligarBase();
        ["popup-coleta","coleta-dock","popup-atendimento","doca-atendimento","popup-editar"].forEach(function(id){var el=document.getElementById(id);if(el)el.remove();});
        atendimento = { assuntos: [], item: null, minimizados: [] };
        state.users = [];
        state.logs = [];
        state.currentUser = null;
        state.screen = "login";
        state.painelAba = "inicio";
        state.trilhoAberto = false;
        state.ultimaCredencial = null;
        state.booted = true;
        render();
      }
    });
  }

  async function aoReceberUsuarios(snap){
    state.users = toArray(snap.val());
    if(ehAdministrativo()){
      var mapa={};state.users.forEach(function(u){if(u.uid)mapa[u.uid]={active:u.active!==false,admin:(u.uid===ADMIN_UID||u.canEdit===true)};});
      db.ref("acessos").set(mapa).catch(function(){toast("Falha ao sincronizar permissões.");});
    }
    state.booted = true;

    var authUser = auth.currentUser;
    if(!authUser){ render(); return; }

    var cadastro = acharCadastro(authUser);

    if(!cadastro){
      if(state.users.length === 0){
        if(state.criandoPrimeiro) return;
        state.criandoPrimeiro = true;
        var novo = {
          uid: authUser.uid,
          email: (authUser.email||"").toLowerCase(),
          username: usuarioDoEmail(authUser.email),
          nome: "",
          cpf: "",
          active: true,
          canEdit: true,
          tempPassword: false,
          createdAt: new Date().toISOString(),
          lastLogin: "",
          previousLogin: ""
        };
        state.users.push(novo);
        var criou = await salvarUsuarios();
        state.criandoPrimeiro = false;
        if(!criou){ state.users.pop(); render(); return; }
        registrar("Primeiro acesso administrativo criado", novo.username);
        return;
      }
      state.error = "Sua conta foi autenticada, mas não há cadastro para ela neste sistema. Fale com o perfil administrativo.";
      auth.signOut();
      return;
    }

    if(cadastro.active === false){
      state.error = "Este acesso está inativo. Fale com o perfil administrativo.";
      auth.signOut();
      return;
    }

    state.currentUser = cadastro;
    state.error = "";

    if(ehAdministrativo() && (!cadastro.uid || !cadastro.email)){
      cadastro.uid = authUser.uid;
      cadastro.email = (authUser.email||"").toLowerCase();
      salvarUsuarios();
    }

    if(cadastro.tempPassword){
      state.screen = "trocaSenha";
    } else {
      if(!state.loginRegistrado){
        state.loginRegistrado = true;
        cadastro.previousLogin = cadastro.lastLogin || "";
        cadastro.lastLogin = new Date().toISOString();
        salvarUsuarios();
      }
      if(state.screen !== "painel") state.screen = "painel";
    }

    if(digitandoNoFormulario()) return;
    render();
  }

  function render(){
    if(!state.booted){
      app.innerHTML = '<div class="carregando"><span class="giro"></span>Carregando…</div>';
      return;
    }

    var html;
    if(state.screen === "config") html = telaConfig();
    else if(state.screen === "trocaSenha") html = telaTrocaSenha();
    else if(state.screen === "painel") html = telaPainel();
    else html = telaLogin();

    app.innerHTML = html;
    ligarEventos();
  }

  function totaisColeta(lista){
    var t = {veiculos:0, cnh:0, outros:0, total:0};
    (lista || state.coleta).forEach(function(item){

      if(g === "veiculos") t.veiculos++;
      else if(g === "cnh") t.cnh++;
      else t.outros++;
      t.total++;
    });
    return t;
  }

    for(var i=0;i<state.assuntos.length;i++){

    }
    return null;

  function grupoAssunto(nome){
    var info = assuntoInfo(nome);
    if(info && info.grupo) return info.grupo;
    if(nome === "VEÍCULOS" || nome === "MULTAS") return "veiculos";
    if(nome === "CNH" || nome === "PORTAL") return "cnh";
    return "outros";

  function descricaoInfo(nome){
    for(var i=0;i<state.descricoes.length;i++){
      if(state.descricoes[i].nome === nome) return state.descricoes[i];
    }
    return null;
  }

  function ehPendente(descricao){
    var info = descricaoInfo(descricao);
    if(info) return info.tipo === "pendente";
    return descricao === "AGUARDANDO";
  }

  function capitalizar(texto){
    var t = String(texto || "");
    if(!t) return "";
    return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  }

  function estadoColeta(item){
    var d = item.descricao || "";
    if(d) return ehPendente(d) ? "pendentes" : "respondidas";
    return item.situacao === "RESPONDIDA" ? "respondidas" : "naoRespondidas";
  }

  function rotuloDescricao(d){

  function pedePlaca(assunto){
    var info = assuntoInfo(assunto);
    if(info) return !!info.placa;
    return assunto === "VEÍCULOS" || assunto === "MULTAS";

  function chaveData(d){
    var p = String(d || "").split("/");
    if(p.length !== 3) return "";
    var ano = p[2].length === 2 ? "20" + p[2] : p[2];
    return ano + p[1] + p[0];
  }

  function graficosDash(itens, cabecalho){
    var total = itens.length;
    var tratadas = itens.filter(function(i){ return !!i.descricao && !ehPendente(i.descricao); }).length;
    var porDescricao = {};
    state.descricoes.forEach(function(d){ porDescricao[d.nome] = 0; });
    itens.forEach(function(i){ if(i.descricao && porDescricao[i.descricao] !== undefined) porDescricao[i.descricao]++; });
    var nomesDescricao = Object.keys(porDescricao);
    var maiorDescricao = Math.max.apply(null, nomesDescricao.map(function(n){ return porDescricao[n]; }).concat([1]));
    var aguardando = itens.filter(function(i){ return estadoColeta(i) === "pendentes"; }).length;
    var respondidas = itens.filter(function(i){ return estadoColeta(i) === "respondidas"; }).length;
    var pendentes = total - respondidas - aguardando;
    var percentual = total > 0 ? Math.round((respondidas / total) * 100) + "%" : "—";

    var notas = itens.filter(function(i){ return typeof i.nota === "number"; });
    var soma = notas.reduce(function(acc, i){ return acc + i.nota; }, 0);
    var media = notas.length ? (soma / notas.length).toFixed(1).replace(".", ",") : "—";
    var promotoras = notas.filter(function(i){ return i.nota >= 9; }).length;
    var detratoras = notas.filter(function(i){ return i.nota <= 6; }).length;

    var grupos = totaisColeta(itens);
    var maiorGrupo = Math.max(grupos.veiculos, grupos.cnh, grupos.outros, 1);

    var porAssunto = {};
    nomesAssuntos().forEach(function(a){ porAssunto[a] = 0; });
    itens.forEach(function(i){ if(porAssunto[i.assunto] !== undefined) porAssunto[i.assunto]++; });
    var maiorAssunto = Math.max.apply(null, nomesAssuntos().map(function(a){ return porAssunto[a]; }).concat([1]));

    var porDia = {};
    itens.forEach(function(i){
      var d = i.data || "—";
      porDia[d] = (porDia[d] || 0) + 1;
    });
    var dias = Object.keys(porDia).sort(function(a,b){ return chaveData(b).localeCompare(chaveData(a)); }).slice(0,10);
    var maiorDia = Math.max.apply(null, dias.map(function(d){ return porDia[d]; }).concat([1]));

    var cartaoNotas = notas.length
      ? barra("Nota 9 e 10", promotoras, notas.length, "verde") +
        barra("Nota 7 e 8", notas.length - promotoras - detratoras, notas.length) +
        barra("Nota 0 a 6", detratoras, notas.length, "vermelha")
      : '<div class="vazio">Nenhuma avaliação registrada ainda.</div>';

    return '' +
    '<div class="cartao">' +
      cabecalho +
      '<div class="painel-totais quatro">' +
        '<div class="total-item"><span>Não respondidas</span><b>' + pendentes + '</b></div>' +
        '<div class="total-item"><span>Pendentes</span><b>' + aguardando + '</b></div>' +
        '<div class="total-item"><span>Respondidas</span><b>' + respondidas + '</b></div>' +
        '<div class="total-item destaque"><span>Total</span><b>' + total + '</b></div>' +
      '</div>' +
      '<div class="painel-totais quatro" style="margin-top:12px">' +
        '<div class="total-item"><span>Tratadas</span><b>' + tratadas + '</b></div>' +
        '<div class="total-item"><span>% respondidas</span><b>' + percentual + '</b></div>' +
        '<div class="total-item"><span>Avaliadas</span><b>' + itens.filter(function(i){ return typeof i.nota === "number"; }).length + '</b></div>' +
        '<div class="total-item"><span>Assuntos</span><b>' + state.assuntos.length + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="cartao">' +
      '<h2>Por descrição</h2>' +
      (nomesDescricao.length
        ? nomesDescricao.map(function(n){ return barra(capitalizar(n), porDescricao[n], maiorDescricao); }).join('')
        : '<div class="vazio">Nenhuma descrição cadastrada.</div>') +
    '</div>' +
    '<div class="cartao">' +
      '<h2>Por grupo</h2>' +
      barra("Veículos", grupos.veiculos, maiorGrupo) +
      barra("CNH", grupos.cnh, maiorGrupo) +
      barra("Outros", grupos.outros, maiorGrupo) +
    '</div>' +
    '<div class="cartao">' +
      '<h2>Por assunto</h2>' +
      nomesAssuntos().map(function(a){ return barra(a, porAssunto[a], maiorAssunto); }).join('') +
    '</div>' +
    '<div class="cartao">' +
      '<h2>Avaliações</h2>' +
      '<div class="painel-totais quatro" style="margin-bottom:20px">' +
        '<div class="total-item"><span>Nota média</span><b>' + media + '</b></div>' +
        '<div class="total-item"><span>Avaliadas</span><b>' + notas.length + '</b></div>' +
        '<div class="total-item"><span>Nota 9 e 10</span><b>' + promotoras + '</b></div>' +
        '<div class="total-item"><span>Nota 0 a 6</span><b>' + detratoras + '</b></div>' +
      '</div>' +
      cartaoNotas +
    '</div>' +
    '<div class="cartao">' +
      '<h2>Por data</h2>' +
      (dias.length
        ? dias.map(function(d){ return barra(d, porDia[d], maiorDia); }).join('')
        : '<div class="vazio">Nenhum registro importado ainda.</div>') +
    '</div>';
  }

  function mesDoItem(item){
    return chaveData(item.data).slice(0,6);
  }

  function rotuloMes(chave){
    chave = String(chave || "");
    if(chave.length !== 6) return chave;
    return chave.slice(4,6) + "/" + chave.slice(0,4);
  }

  function rotuloEstado(item){
    var e = estadoColeta(item);
    if(e === "respondidas") return "Respondida";
    if(e === "pendentes") return "Pendente";
    return "Não respondida";
  }

  function normalizarBusca(t){
    return String(t == null ? "" : t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  function textoBusca(item){
    return normalizarBusca([
      item.id, item.data, item.assunto, item.cpf, item.cpf ? formatCPF(item.cpf) : "", item.placa,
      item.nome, item.descricao, item.observacao, item.sac, item.sustentacao,
      item.situacao, item.responsavel, (typeof item.nota === "number" ? "nota " + item.nota : "")
    ].join(" | "));
  }

  async function carregarArquivo(){
    if(state.arquivoCache) return state.arquivoCache;
    var snap = await db.ref("arquivo").once("value");
    var bruto = snap.val() || {};
    var lista = [];
    Object.keys(bruto).forEach(function(mes){
      var grupo = bruto[mes] || {};
      Object.keys(grupo).forEach(function(id){
        if(grupo[id]) lista.push({item:grupo[id], mes:mes});
      });
    });
    state.arquivoCache = lista;
    return lista;
  }

  function pesquisaPadrao(){
    return {condicoes:[], incluirArquivo:true};
  }





  var CAMPOS_FILTRO = [
    {chave:"id", rotulo:"Nº do ID", tipo:"lista", ops:["um","nao_um","contem"]},
    {chave:"data", rotulo:"Data de abertura", tipo:"data", ops:["entre","igual","antes","depois"]},
    {chave:"assunto", rotulo:"Assunto", tipo:"opcoes", ops:["um","nao_um"]},
    {chave:"estado", rotulo:"Situação", tipo:"opcoes", ops:["um","nao_um"]},
    {chave:"descricao", rotulo:"Descrição", tipo:"opcoes", ops:["um","nao_um","vazio","nao_vazio"]},
    {chave:"responsavel", rotulo:"Atribuído a", tipo:"opcoes", ops:["um","nao_um","vazio","nao_vazio"]},
    {chave:"nome", rotulo:"Tratado por", tipo:"opcoes", ops:["um","nao_um","vazio","nao_vazio"]},
    {chave:"cpf", rotulo:"CPF", tipo:"lista", ops:["um","nao_um","contem","vazio","nao_vazio"]},
    {chave:"placa", rotulo:"Placa", tipo:"lista", ops:["um","nao_um","contem","vazio","nao_vazio"]},
    {chave:"nota", rotulo:"Nota", tipo:"numero", ops:["igual","maior_igual","menor_igual","vazio","nao_vazio"]},
    {chave:"observacao", rotulo:"Observação", tipo:"texto", ops:["contem","nao_contem","vazio","nao_vazio"]},
    {chave:"sac", rotulo:"SAC", tipo:"texto", ops:["contem","vazio","nao_vazio"]},
    {chave:"sustentacao", rotulo:"Sustentação", tipo:"texto", ops:["contem","vazio","nao_vazio"]},
    {chave:"qualquer", rotulo:"Qualquer campo", tipo:"texto", ops:["contem"]}
  ];

  var OPERADORES = {
    um:"é um dos", nao_um:"não é um dos", contem:"contém", nao_contem:"não contém",
    vazio:"está vazio", nao_vazio:"não está vazio", entre:"entre", igual:"é",
    antes:"antes de", depois:"depois de", maior_igual:"maior ou igual a", menor_igual:"menor ou igual a"
  };

  var IC_LIXEIRA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6 7l1 13h10l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';

  function campoFiltro(chave){
    for(var i=0;i<CAMPOS_FILTRO.length;i++){ if(CAMPOS_FILTRO[i].chave === chave) return CAMPOS_FILTRO[i]; }
    return null;
  }

  function pessoasOrdenadas(){
    return state.users.filter(function(u){ return u && u.username; })
      .sort(function(a,b){ return nomeExibido(a).localeCompare(nomeExibido(b)); });
  }

  function opcoesDoCampo(chave){
    if(chave === "assunto") return nomesAssuntos().map(function(a){ return [a, a]; });
    if(chave === "estado") return [["naoRespondidas","Não respondida"],["pendentes","Pendente"],["respondidas","Respondida"]];
    if(chave === "descricao") return state.descricoes.map(function(d){ return [d.nome, capitalizar(d.nome)]; });
    if(chave === "responsavel") return pessoasOrdenadas().map(function(u){ return [String(u.username).toLowerCase(), nomeExibido(u)]; });
    if(chave === "nome"){
      var nomes = {};
      pessoasOrdenadas().forEach(function(u){ nomes[nomeExibido(u)] = 1; });
      state.coleta.forEach(function(i){ if(i.nome) nomes[i.nome] = 1; });
      return Object.keys(nomes).sort().map(function(n){ return [n, n]; });
    }
    return [];
  }

  function normalizarValorCampo(chave, v){
    if(v === undefined || v === null) return "";
    if(chave === "cpf" || chave === "id") return digitos(String(v));
    if(chave === "placa") return String(v).toUpperCase().replace(/[^A-Z0-9]/g, "");
    if(chave === "responsavel") return String(v).toLowerCase();
    return String(v);
  }

  function valorDoItem(item, chave){
    if(chave === "data") return chaveData(item.data);
    if(chave === "estado") return estadoColeta(item);
    if(chave === "nota") return typeof item.nota === "number" ? item.nota : "";
    return normalizarValorCampo(chave, item[chave]);
  }

  function valorPadrao(campo, operador){
    if(!campo || operador === "vazio" || operador === "nao_vazio") return null;
    if(operador === "entre") return ["", ""];
    if((campo.tipo === "opcoes" || campo.tipo === "lista") && (operador === "um" || operador === "nao_um")) return [];
    return "";
  }

  function testaCondicao(item, c){
    var campo = campoFiltro(c.campo);
    if(!campo) return true;
    var op = c.operador;

    if(c.campo === "qualquer"){
      var partes = normalizarBusca(c.valor).split(/\s+/).filter(Boolean);
      if(!partes.length) return true;
      var texto = textoBusca(item);
      return partes.every(function(p){ return texto.indexOf(p) !== -1; });
    }

    var v = valorDoItem(item, c.campo);
    var vazio = (v === "" || v === null || v === undefined);

    if(op === "vazio") return vazio;
    if(op === "nao_vazio") return !vazio;

    if(op === "um" || op === "nao_um"){
      var lista = (c.valor || []).map(function(x){ return normalizarValorCampo(c.campo, x); }).filter(Boolean);
      if(!lista.length) return true;
      var dentro = lista.indexOf(String(v)) !== -1;
      return op === "um" ? dentro : !dentro;
    }

    if(op === "contem" || op === "nao_contem"){
      var busca = normalizarBusca(c.campo === "cpf" || c.campo === "id" || c.campo === "placa" ? normalizarValorCampo(c.campo, c.valor) : c.valor);
      if(!busca) return true;
      var tem = normalizarBusca(v).indexOf(busca) !== -1;
      return op === "contem" ? tem : !tem;
    }

    if(c.campo === "data"){
      if(op === "entre"){
        var de = chaveISO(c.valor && c.valor[0]), ate = chaveISO(c.valor && c.valor[1]);
        if(!de && !ate) return true;
        if(vazio) return false;
        if(de && v < de) return false;
        if(ate && v > ate) return false;
        return true;
      }
      var alvo = chaveISO(c.valor);
      if(!alvo) return true;
      if(vazio) return false;
      if(op === "igual") return v === alvo;
      if(op === "antes") return v < alvo;
      if(op === "depois") return v > alvo;
    }

    if(c.campo === "nota"){
      if(c.valor === "" || c.valor === null || isNaN(Number(c.valor))) return true;
      if(vazio) return false;
      var n = Number(c.valor);
      if(op === "igual") return v === n;
      if(op === "maior_igual") return v >= n;
      if(op === "menor_igual") return v <= n;
    }
    return true;
  }

  function gruposDeCondicoes(conds){
    var grupos = [];
    (conds || []).forEach(function(c, i){
      if(i === 0 || c.conector !== "ou") grupos.push([c]);
      else grupos[grupos.length - 1].push(c);
    });
    return grupos;
  }

  function passaNosFiltros(item, f){
    var conds = (f && f.condicoes) || [];
    if(!conds.length) return true;
    return gruposDeCondicoes(conds).every(function(g){
      return g.some(function(c){ return testaCondicao(item, c); });
    });
  }

  function contarFiltros(f){
    return ((f && f.condicoes) || []).length;
  }

  function filtrosDe(alvo){
    return alvo === "inicio" ? state.filtrosInicio : state.pesquisa;
  }

  function botaoFiltro(alvo){
    var n = contarFiltros(filtrosDe(alvo));
    return '<button class="btn btn-neutro btn-mini btn-filtro" data-abrir-filtros="' + alvo + '" aria-label="Filtros" title="Filtros">' +
      IC_FILTRO + (n ? '<span class="contador-filtro">' + n + '</span>' : '') + '</button>';
  }

  function controleValor(c, i){
    var campo = campoFiltro(c.campo);
    if(!campo) return '<input type="text" disabled placeholder="Escolha o campo">';
    var op = c.operador;

    if(op === "vazio" || op === "nao_vazio") return '<input type="text" disabled value="">';

    if(op === "um" || op === "nao_um"){
      if(campo.tipo === "opcoes"){
        var opcoes = opcoesDoCampo(c.campo);
        var escolhidos = c.valor || [];
        var rotulos = {};
        opcoes.forEach(function(o){ rotulos[o[0]] = o[1]; });
        var chips = escolhidos.map(function(v){
          return '<span class="chip-filtro">' + esc(rotulos[v] || v) +
            '<button type="button" data-tirar-chip="' + i + '" data-valor="' + esc(v) + '" aria-label="Remover">×</button></span>';
        }).join("");
        var livres = opcoes.filter(function(o){ return escolhidos.indexOf(o[0]) === -1; });
        return '<div class="caixa-chips">' + chips +
          (livres.length
            ? '<select class="chip-add" data-i="' + i + '"><option value="">+ adicionar</option>' +
                livres.map(function(o){ return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join("") +
              '</select>'
            : '') +
        '</div>';
      }
      return '<textarea class="cond-lista" data-i="' + i + '" placeholder="Separe por vírgula, espaço ou linha">' + esc((c.valor || []).join(", ")) + '</textarea>';
    }

    if(campo.tipo === "data"){
      if(op === "entre"){
        var par = c.valor || ["",""];
        return '<div class="cond-datas">' +
          '<input type="date" class="cond-de" data-i="' + i + '" value="' + esc(par[0]) + '">' +
          '<span>e</span>' +
          '<input type="date" class="cond-ate" data-i="' + i + '" value="' + esc(par[1]) + '">' +
        '</div>';
      }
      return '<input type="date" class="cond-valor" data-i="' + i + '" value="' + esc(c.valor || "") + '">';
    }

    if(campo.tipo === "numero"){
      return '<input type="text" inputmode="numeric" class="cond-valor" data-i="' + i + '" placeholder="0 a 10" value="' + esc(c.valor || "") + '">';
    }

    return '<input type="text" class="cond-valor" data-i="' + i + '" value="' + esc(c.valor || "") + '">';
  }

  function linhaCondicao(c, i){
    var campo = campoFiltro(c.campo);
    var opcoesCampo = '<option value="">— escolha o campo —</option>' + CAMPOS_FILTRO.map(function(cf){
      return '<option value="' + cf.chave + '"' + (cf.chave === c.campo ? " selected" : "") + '>' + esc(cf.rotulo) + '</option>';
    }).join("");
    var opcoesOperador = campo
      ? campo.ops.map(function(o){ return '<option value="' + o + '"' + (o === c.operador ? " selected" : "") + '>' + OPERADORES[o] + '</option>'; }).join("")
      : '<option value="">—</option>';
    var ehOu = i > 0 && c.conector === "ou";

    return '<div class="cond-linha' + (ehOu ? ' cond-ou' : '') + '" data-i="' + i + '">' +
      (i > 0 ? '<div class="cond-conector">' + (ehOu ? "ou" : "e") + '</div>' : '') +
      '<div class="cond-grade">' +
        '<div class="campo"><label>Campo</label><select class="cond-campo" data-i="' + i + '">' + opcoesCampo + '</select></div>' +
        '<div class="campo"><label>Operador</label><select class="cond-operador" data-i="' + i + '"' + (campo ? '' : ' disabled') + '>' + opcoesOperador + '</select></div>' +
        '<div class="campo"><label>Valor</label>' + controleValor(c, i) + '</div>' +
        '<div class="cond-botoes">' +
          '<button type="button" class="cond-btn" data-cond-ou="' + i + '" title="Adicionar condição OU">ou</button>' +
          '<button type="button" class="cond-btn" data-cond-e="' + i + '" title="Adicionar condição E">e</button>' +
          '<button type="button" class="cond-lixo" data-cond-remover="' + i + '" aria-label="Remover condição" title="Remover condição">' + IC_LIXEIRA + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function condicaoVazia(conector){
    return {conector: conector || "e", campo:"", operador:"", valor:null};
  }

  function lerCondicoes(d, conds){
    conds.forEach(function(c, i){
      var campo = campoFiltro(c.campo);
      if(!campo) return;
      var op = c.operador;
      if(op === "vazio" || op === "nao_vazio"){ c.valor = null; return; }
      if(op === "um" || op === "nao_um"){
        if(campo.tipo === "opcoes") return;
        var t = d.querySelector('.cond-lista[data-i="' + i + '"]');
        if(!t) return;
        var vistos = {};
        c.valor = String(t.value).split(/[\s,;]+/).map(function(x){ return x.trim(); }).filter(function(x){
          if(!x || vistos[x]) return false;
          vistos[x] = true; return true;
        });
        return;
      }
      if(op === "entre"){
        var de = d.querySelector('.cond-de[data-i="' + i + '"]'), ate = d.querySelector('.cond-ate[data-i="' + i + '"]');
        c.valor = [de ? de.value : "", ate ? ate.value : ""];
        return;
      }
      var el = d.querySelector('.cond-valor[data-i="' + i + '"]');
      if(el) c.valor = el.value;
    });
  }

  function fimDoGrupo(conds, i){
    var j = i;
    while(j + 1 < conds.length && conds[j + 1].conector === "ou") j++;
    return j;
  }

  function abrirFiltros(alvo){
    var velho = document.getElementById("popup-filtros");
    if(velho) velho.remove();

    var original = filtrosDe(alvo);
    var rascunho = JSON.parse(JSON.stringify(original));
    var conds = rascunho.condicoes && rascunho.condicoes.length ? rascunho.condicoes : [condicaoVazia("e")];

    var d = document.createElement("dialog");
    d.id = "popup-filtros";
    d.setAttribute("aria-labelledby","titulo-filtros");
    d.innerHTML = '<div class="filtros-topo"><h2 id="titulo-filtros">' + IC_FILTRO + 'Filtros</h2>' +
        '<button class="btn btn-neutro btn-mini" id="fx-fechar" aria-label="Fechar" title="Fechar">×</button></div>' +
      '<div class="filtros-miolo">' +
        '<div id="fx-linhas"></div>' +
        (alvo === "dash"
          ? '<label class="opcao-inline" style="padding-top:4px"><input type="checkbox" id="fx-arquivo"' + (rascunho.incluirArquivo ? " checked" : "") + '>Incluir arquivo</label>'
          : '') +
        '<div class="pesquisa-acoes" style="margin-top:14px">' +
          '<button class="btn btn-principal" style="width:auto" id="fx-aplicar">Aplicar filtros</button>' +
          '<button class="btn btn-neutro" id="fx-limpar">Limpar tudo</button>' +
          (alvo === "dash" ? '<button class="btn btn-neutro" id="fx-mes">Mês atual</button>' : '') +
        '</div>' +
      '</div>';
    document.body.appendChild(d);

    function desenhar(){
      d.querySelector("#fx-linhas").innerHTML = conds.map(linhaCondicao).join("");

      Array.prototype.forEach.call(d.querySelectorAll(".cond-campo"), function(s){
        s.onchange = function(){
          lerCondicoes(d, conds);
          var c = conds[Number(s.getAttribute("data-i"))];
          var campo = campoFiltro(s.value);
          c.campo = s.value;
          c.operador = campo ? campo.ops[0] : "";
          c.valor = valorPadrao(campo, c.operador);
          desenhar();
        };
      });
      Array.prototype.forEach.call(d.querySelectorAll(".cond-operador"), function(s){
        s.onchange = function(){
          lerCondicoes(d, conds);
          var c = conds[Number(s.getAttribute("data-i"))];
          var antes = c.operador;
          c.operador = s.value;
          var mesmoTipo = (antes === "um" || antes === "nao_um") === (c.operador === "um" || c.operador === "nao_um") &&
            antes !== "entre" && c.operador !== "entre" &&
            antes !== "vazio" && antes !== "nao_vazio";
          if(!mesmoTipo) c.valor = valorPadrao(campoFiltro(c.campo), c.operador);
          desenhar();
        };
      });
      Array.prototype.forEach.call(d.querySelectorAll(".chip-add"), function(s){
        s.onchange = function(){
          if(!s.value) return;
          lerCondicoes(d, conds);
          var c = conds[Number(s.getAttribute("data-i"))];
          c.valor = (c.valor || []).concat([s.value]);
          desenhar();
        };
      });
      Array.prototype.forEach.call(d.querySelectorAll("[data-tirar-chip]"), function(b){
        b.onclick = function(){
          lerCondicoes(d, conds);
          var c = conds[Number(b.getAttribute("data-tirar-chip"))];
          var alvoValor = b.getAttribute("data-valor");
          c.valor = (c.valor || []).filter(function(v){ return v !== alvoValor; });
          desenhar();
        };
      });
      Array.prototype.forEach.call(d.querySelectorAll("[data-cond-ou]"), function(b){
        b.onclick = function(){
          lerCondicoes(d, conds);
          var i = Number(b.getAttribute("data-cond-ou"));
          conds.splice(i + 1, 0, condicaoVazia("ou"));
          desenhar();
        };
      });
      Array.prototype.forEach.call(d.querySelectorAll("[data-cond-e]"), function(b){
        b.onclick = function(){
          lerCondicoes(d, conds);
          var i = Number(b.getAttribute("data-cond-e"));
          conds.splice(fimDoGrupo(conds, i) + 1, 0, condicaoVazia("e"));
          desenhar();
        };
      });
      Array.prototype.forEach.call(d.querySelectorAll("[data-cond-remover]"), function(b){
        b.onclick = function(){
          lerCondicoes(d, conds);
          var i = Number(b.getAttribute("data-cond-remover"));
          var inicioDeGrupo = (i === 0 || conds[i].conector !== "ou");
          conds.splice(i, 1);
          if(inicioDeGrupo && conds[i] && conds[i].conector === "ou") conds[i].conector = "e";
          if(!conds.length) conds.push(condicaoVazia("e"));
          desenhar();
        };
      });
    }

    function fechar(){ d.close(); d.remove(); }

    function aplicar(){
      lerCondicoes(d, conds);
      var validas = conds.filter(function(c){ return !!campoFiltro(c.campo); });
      if(validas.length) validas[0].conector = "e";
      rascunho.condicoes = validas;
      var arq = d.querySelector("#fx-arquivo");
      rascunho.incluirArquivo = arq ? arq.checked : false;
      if(alvo === "inicio") state.filtrosInicio = rascunho;
      else state.pesquisa = rascunho;
      fechar();
      render();
    }

    d.querySelector("#fx-fechar").onclick = fechar;
    d.addEventListener("cancel", function(e){ e.preventDefault(); fechar(); });
    d.querySelector("#fx-aplicar").onclick = aplicar;
    d.querySelector("#fx-limpar").onclick = function(){
      conds = [condicaoVazia("e")];
      desenhar();
    };
    var mes = d.querySelector("#fx-mes");
    if(mes) mes.onclick = function(){
      lerCondicoes(d, conds);
      var hoje = new Date();
      var periodo = {conector:"e", campo:"data", operador:"entre",
        valor:[iso(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), iso(hoje)]};
      var achou = false;
      conds.forEach(function(c, i){ if(!achou && c.campo === "data" && c.operador === "entre"){ periodo.conector = c.conector; conds[i] = periodo; achou = true; } });
      if(!achou){
        conds = conds.filter(function(c){ return !!c.campo; });
        conds.push(periodo);
        if(conds.length) conds[0].conector = "e";
      }
      desenhar();
    };

    desenhar();
    d.showModal();
  }

  function registrosDash(){
    var f = state.pesquisa;
    var base = state.coleta.map(function(i){ return {item:i, mes:""}; });
    if(f.incluirArquivo){
      if(state.arquivoCache){
        base = base.concat(state.arquivoCache);
      } else if(!state.arquivoCarregando){
        state.arquivoCarregando = true;
        carregarArquivo().then(function(){
          state.arquivoCarregando = false;
          if(state.painelAba === "dash") render();
        }).catch(function(err){
          state.arquivoCarregando = false;
          state.pesquisa.incluirArquivo = false;
          toast(msgBanco(err));
          render();
        });
      }
    }
    var vistos = {};
    base = base.filter(function(r){
      var id = String(r.item.id);
      if(vistos[id]) return false;
      vistos[id] = true;
      return true;
    });
    var achados = base.filter(function(r){ return passaNosFiltros(r.item, f); });
    achados.sort(function(a,b){ return chaveData(b.item.data).localeCompare(chaveData(a.item.data)); });
    return achados;

  function valorCsv(v){
    var t = String(v == null ? "" : v);
    if(/[;"\n\r]/.test(t)) t = '"' + t.replace(/"/g, '""') + '"';
    return t;
  }

  function baixarPlanilha(){
    var r = registrosDash();
    if(!r.length){ toast("Não há registros com esses filtros."); return; }

    var cab = ["DATA","ID","ASSUNTO","SITUAÇÃO","CPF","PLACA","NOME","ATRIBUÍDO A","DESCRIÇÃO","OBSERVAÇÃO","SAC","SUSTENTAÇÃO","NOTA","LOCAL"];
    var linhas = r.map(function(x){
      var i = x.item;
      return [
        i.data, i.id, i.assunto, rotuloEstado(i), i.cpf ? digitos(i.cpf) : "", i.placa,
        i.nome, nomeDoResponsavel(i.responsavel), i.descricao ? capitalizar(i.descricao) : "", i.observacao, i.sac, i.sustentacao,
        (typeof i.nota === "number" ? i.nota : ""), x.mes ? "Arquivo " + rotuloMes(x.mes) : "Ativo"
      ].map(valorCsv).join(";");
    });

    var conteudo = "\uFEFF" + cab.join(";") + "\r\n" + linhas.join("\r\n");
    var blob = new Blob([conteudo], {type:"text/csv;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "painel_RA_" + iso(new Date()) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast(r.length + " linha(s) baixada(s).");
  }

  function copiaLimpa(item){
    var c = {};
    for(var k in item){
      if(Object.prototype.hasOwnProperty.call(item,k) && item[k] !== undefined) c[k] = item[k];
    }
    return c;
  }

  async function arquivarSelecionados(){
    if(!ehAdministrativo()) return toast("Só o perfil administrativo pode arquivar.");
    var feedback = document.getElementById("arquivo-feedback");
    var meses = Object.keys(state.arquivoSelecao).filter(function(m){ return state.arquivoSelecao[m]; });
    if(!meses.length){ feedback.textContent = "Marque pelo menos um mês."; return; }

    var modo = state.arquivoModo;
    var itens = state.coleta.filter(function(i){
      if(meses.indexOf(mesDoItem(i)) === -1) return false;
      return modo === "tudo" || estadoColeta(i) === "respondidas";
    });
    if(!itens.length){ feedback.textContent = "Nenhum registro se encaixa nessa seleção."; return; }
    if(casoAberto && itens.some(function(i){ return casoAberto(i.id); })){
      feedback.textContent = "Há protocolos dessa seleção abertos no atendimento. Feche-os antes de arquivar.";
      return;
    }
    if(!confirm("Arquivar " + itens.length + " registro(s) de " + meses.map(rotuloMes).join(", ") + "?")) return;

    ocupar("arquivo-arquivar", "Arquivando…");
    var contagem = {}, feitos = 0;
    try {
      for(var ini = 0; ini < itens.length; ini += 250){
        var lote = itens.slice(ini, ini + 250), mudancas = {};
        lote.forEach(function(i){
          var m = mesDoItem(i);
          mudancas["arquivo/" + m + "/" + i.id] = copiaLimpa(i);
          mudancas["arquivoIds/" + i.id] = m;
          mudancas["coleta/" + i.id] = null;
          contagem[m] = (contagem[m] || 0) + 1;
        });
        await db.ref().update(mudancas);
        feitos += lote.length;
        feedback.textContent = feitos + " de " + itens.length + " arquivados…";
      }
      var indice = {};
      Object.keys(contagem).forEach(function(m){
        indice["arquivoIndice/" + m] = (Number(state.arquivoIndice[m]) || 0) + contagem[m];
      });
      await db.ref().update(indice);
      state.arquivoCache = null;
      state.arquivoSelecao = {};
      registrar("Arquivados " + feitos + " registros", meses.map(rotuloMes).join(", "));
      toast(feitos + " registro(s) arquivado(s).");
      render();
    } catch(err){
      liberar("arquivo-arquivar");
      feedback.textContent = feitos + " de " + itens.length + " arquivados antes do erro: " + msgBanco(err);
    }
  }

  async function restaurarMes(mes){
    if(!ehAdministrativo()) return toast("Só o perfil administrativo pode restaurar.");
    if(!confirm("Devolver " + rotuloMes(mes) + " para a base ativa?")) return;
    try {
      var snap = await db.ref("arquivo/" + mes).once("value");
      var grupo = snap.val() || {};
      var ids = Object.keys(grupo);
      for(var ini = 0; ini < ids.length; ini += 250){
        var mudancas = {};
        ids.slice(ini, ini + 250).forEach(function(id){
          mudancas["coleta/" + id] = grupo[id];
          mudancas["arquivo/" + mes + "/" + id] = null;
          mudancas["arquivoIds/" + id] = null;
        });
        await db.ref().update(mudancas);
      }
      await db.ref("arquivoIndice/" + mes).remove();
      state.arquivoCache = null;
      registrar("Restaurados " + ids.length + " registros", rotuloMes(mes));
      toast(ids.length + " registro(s) devolvido(s) à base ativa.");
      render();
    } catch(err){
      toast(msgBanco(err));
    }
  }

  function preenchidos(item){
    var c = {};
    for(var k in item){
      if(!Object.prototype.hasOwnProperty.call(item,k)) continue;
      var v = item[k];
      if(v === undefined || v === null || v === "") continue;
      c[k] = v;
    }
    return c;
  }

  async function corrigirDuplicados(){
    if(!ehAdministrativo()) return toast("Só o perfil administrativo pode corrigir duplicados.");
    var feedback = document.getElementById("arquivo-feedback");
    ocupar("arquivo-duplicados", "Verificando…");
    try {
      state.arquivoCache = null;
      var arquivo = await carregarArquivo();

      var porId = {};
      arquivo.forEach(function(r){
        var id = String(r.item.id);
        (porId[id] = porId[id] || []).push(r);
      });

      var ativos = {};
      state.coleta.forEach(function(i){ ativos[String(i.id)] = i; });

      var mudancas = [], resolvidos = 0, mantidos = {};
      Object.keys(porId).forEach(function(id){
        var ocorrencias = porId[id];
        var ativo = ativos[id];

        if(ativo){
          var mesclado = {};
          ocorrencias.forEach(function(r){ Object.assign(mesclado, preenchidos(r.item)); });
          Object.assign(mesclado, preenchidos(ativo));
          if(ocorrencias.some(function(r){ return r.item.situacao === "RESPONDIDA"; })) mesclado.situacao = "RESPONDIDA";
          mudancas.push(["coleta/" + id, mesclado]);
          ocorrencias.forEach(function(r){ mudancas.push(["arquivo/" + r.mes + "/" + id, null]); });
          mudancas.push(["arquivoIds/" + id, null]);
          resolvidos++;
          return;
        }

        var certo = ocorrencias.filter(function(r){ return r.mes === mesDoItem(r.item); })[0] || ocorrencias[0];
        if(ocorrencias.length > 1){
          var junto = {};
          ocorrencias.forEach(function(r){ Object.assign(junto, preenchidos(r.item)); });
          Object.assign(junto, preenchidos(certo.item));
          if(ocorrencias.some(function(r){ return r.item.situacao === "RESPONDIDA"; })) junto.situacao = "RESPONDIDA";
          mudancas.push(["arquivo/" + certo.mes + "/" + id, junto]);
          ocorrencias.forEach(function(r){ if(r !== certo) mudancas.push(["arquivo/" + r.mes + "/" + id, null]); });
          resolvidos++;
        }
        mantidos[id] = certo.mes;
      });

      for(var ini = 0; ini < mudancas.length; ini += 400){
        var lote = {};
        mudancas.slice(ini, ini + 400).forEach(function(m){ lote[m[0]] = m[1]; });
        await db.ref().update(lote);
      }

      var contagem = {};
      Object.keys(mantidos).forEach(function(id){ contagem[mantidos[id]] = (contagem[mantidos[id]] || 0) + 1; });
      await db.ref("arquivoIds").set(Object.keys(mantidos).length ? mantidos : null);
      await db.ref("arquivoIndice").set(Object.keys(contagem).length ? contagem : null);

      state.arquivoCache = null;
      registrar("Correção de IDs duplicados (" + resolvidos + ")", "arquivo");
      toast(resolvidos ? resolvidos + " ID(s) duplicado(s) unificado(s)." : "Nenhum ID duplicado encontrado.");
      render();
    } catch(err){
      liberar("arquivo-duplicados");
      if(feedback) feedback.textContent = "Não foi possível concluir: " + msgBanco(err);
    }
  }

  function padronizarDescricao(valor){

      if(state.descricoes[i].nome.toUpperCase() === v) return state.descricoes[i].nome;

  function normalizarLinhaBase(p){
    var item = normalizarItem({ data:p[0], id:p[1], assunto:String(p[2]||"").trim().toUpperCase(), nota:p[7] });

    item.cpf = "";
    item.placa = "";
    String(p[3] || "").split(/[^0-9A-Za-zÀ-ú.\-]+/).forEach(function(t){
      if(!t) return;
      var d = digitos(t);
      var limpo = t.replace(/-/g, "").toUpperCase();
      if(d.length === 11 && !item.cpf) item.cpf = d;
      else if(/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(limpo) && !item.placa) item.placa = limpo;
    });

    item.nome = String(p[4] || "").trim().slice(0,80);
    item.descricao = padronizarDescricao(p[5]);
    item.observacao = String(p[6] || "").trim().slice(0,600);
    item.responsavel = "";
    item.sac = "";
    item.sustentacao = "";
    item.situacao = ((item.descricao && !ehPendente(item.descricao)) || item.nota !== undefined)
      ? "RESPONDIDA" : "NÃO RESPONDIDA";
    return item;
  }

  async function importarBase(){
    if(!ehAdministrativo()) return toast("Só o perfil administrativo pode importar.");
    var campo = document.getElementById("base-dados");
    var feedback = document.getElementById("base-feedback");
    var botao = document.getElementById("base-importar");
    if(botao.disabled) return;

    var texto = (campo.value || "").trim();
    if(!texto){ feedback.textContent = "Cole os dados antes de importar."; campo.focus(); return; }

    var mapa = new Map(), erros = [];
    texto.split(/\r?\n/).forEach(function(linha, n){
      var bruta = linha.trim();
      if(!bruta || /^\uFEFF?DATA[;\t]/i.test(bruta)) return;
      var p = bruta.split(/[;\t]/).map(function(x){ return x.trim(); });
      try {
        if(p.length < 3 || p.length > 8) throw new Error("Colunas fora do padrão");
        while(p.length < 8) p.push("");
        var item = normalizarLinhaBase(p);
        mapa.set(item.id, item);
      } catch(e){ erros.push(n + 1); }
    });

    if(erros.length){
      feedback.textContent = "Revise as linhas " + erros.join(", ") + ". Nada foi importado.";
      return;
    }

    var itens = Array.from(mapa.values());
    if(!itens.length){ feedback.textContent = "Nenhum registro encontrado."; return; }

    botao.disabled = true;
    var gravados = 0, noArquivo = 0;
    try {
      var arquivados = await idsArquivados();
      for(var i=0;i<itens.length;i++){
        var mesArquivo = arquivados[itens[i].id];
        if(mesArquivo){
          await db.ref("arquivo/" + mesArquivo + "/" + itens[i].id).update(itens[i]);
          noArquivo++;
        } else {
          await db.ref("coleta/" + itens[i].id).update(itens[i]);
        }
        gravados++;
        if(gravados % 25 === 0) feedback.textContent = gravados + " de " + itens.length + " gravados…";
      }
      if(noArquivo) state.arquivoCache = null;
      campo.value = "";
      feedback.textContent = gravados + " registro(s) importado(s)" +
        (noArquivo ? " — " + noArquivo + " já estavam arquivados e foram atualizados no arquivo" : "") + ".";
      registrar("Base importada (" + gravados + " registros)", "coleta");
      toast("Base importada.");
    } catch(err){
      feedback.textContent = gravados + " de " + itens.length + " gravados antes do erro: " + msgBanco(err);
    } finally {
      botao.disabled = false;
    }
  }

      if(atendimento.item && String(atendimento.item.id) !== String(caso.id)) guardarNaDoca(atendimento.item);
      atendimento.item = caso;

      var meus = atribuidosAMim();
      if(meus.length) atendimento.item = meus[0];

  function opcoesDestino(){

    }).sort(function(a,b){ return nomeExibido(a).localeCompare(nomeExibido(b)); });

    return pessoas.map(function(u){

  function ligarAtendimento(){
    liga("assunto-todos", "change", function(){
      var marcar = this.checked;
      cada(".assunto-check", function(c){ c.checked = marcar; });
    });

    cada(".assunto-check", function(c){
      c.addEventListener("change", function(){
        var todos = document.getElementById("assunto-todos");
        if(!todos) return;
        var marcados = 0;
        cada(".assunto-check", function(x){ if(x.checked) marcados++; });
        todos.checked = marcados === state.assuntos.length;
      });
    });

    liga("at-comecar", "click", function(){
      atendimento.assuntos = [];
      cada(".assunto-check", function(c){ if(c.checked) atendimento.assuntos.push(c.value); });
      var feedback = document.getElementById("at-feedback");
      if(!atendimento.assuntos.length){
        feedback.innerHTML = '<div class="aviso aviso-erro">Escolha pelo menos um assunto.</div>';
        return;
      }
      var caso = proximoCaso();
      if(!caso){
        feedback.innerHTML = '<div class="aviso aviso-erro">Nenhum caso disponível nesses assuntos.</div>';
        return;
      }
      atendimento.item = caso;
      renderAtendimento();
    });

    liga("at-cpf", "input", function(){ this.value = digitos(this.value).slice(0,11); atualizarRepetidos(); });
    liga("at-placa", "input", function(){ this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0,7); atualizarRepetidos(); });

    liga("at-assunto", "change", function(){
      var campo = document.getElementById("at-placa-campo");
      if(campo) campo.style.display = pedePlaca(this.value) ? "block" : "none";
    });

    liga("at-descricao", "change", function(){
      var bloco = document.getElementById("at-aguardando");
      if(bloco) bloco.style.display = (this.value && ehPendente(this.value)) ? "grid" : "none";
    });

    liga("at-salvar", "click", function(){ salvarAtendimento(false); });
    liga("at-atribuir", "click", function(){ salvarAtendimento(true); });
    liga("at-mostrar-outro", "click", function(){
      var bloco = document.getElementById("at-outro");
      if(bloco) bloco.style.display = (bloco.style.display === "none") ? "grid" : "none";
    });

      var destino = document.getElementById("at-destino").value;
      if(!destino){ toast("Não há outra pessoa ativa para atribuir."); return; }
      salvarAtendimento(true, destino);
    });

  function atualizarRepetidos(){
    var area = document.getElementById("at-repetidos");
    if(!area || !atendimento.item) return;

    var campoCpf = document.getElementById("at-cpf");
    var campoPlaca = document.getElementById("at-placa");
    var cpf = digitos(campoCpf ? campoCpf.value : "");
    var placa = ((campoPlaca ? campoPlaca.value : "") || "").trim().toUpperCase().replace(/-/g, "");

    var achados = [];
    if(cpf.length === 11 || placa.length >= 6){
      state.coleta.forEach(function(i){
        if(String(i.id) === String(atendimento.item.id)) return;
        var mesmoCpf = cpf.length === 11 && digitos(i.cpf) === cpf;
        var mesmaPlaca = placa.length >= 6 && String(i.placa || "").toUpperCase().replace(/-/g, "") === placa;
        if(mesmoCpf || mesmaPlaca) achados.push({item:i, cpf:mesmoCpf});
      });
    }

    if(!achados.length){ area.innerHTML = ""; return; }

    achados.sort(function(a,b){ return chaveData(b.item.data).localeCompare(chaveData(a.item.data)); });

    area.innerHTML = '<div class="repetidos">' +
      '<span class="repetidos-titulo">' + achados.length + ' protocolo(s) com ' +
        (achados[0].cpf ? "esse CPF" : "essa placa") + '</span>' +
      achados.map(function(a){
        var partes = [a.item.id, a.item.data || "—", a.item.assunto || "—"];
        if(a.item.descricao) partes.push(capitalizar(a.item.descricao));
        if(a.item.nome) partes.push(a.item.nome);
        return '<button data-repetido="' + esc(a.item.id) + '">' + esc(partes.join(" · ")) + '</button>';
      }).join('') +
    '</div>';

    cada("[data-repetido]", function(b){
      b.addEventListener("click", function(){
        var alvo = b.getAttribute("data-repetido");
        for(var i=0;i<state.coleta.length;i++){
          if(String(state.coleta[i].id) === alvo){ abrirAtendimento(state.coleta[i]); return; }
        }
      });
    });
  }

  async function salvarAtendimento(atribuir, destino){
    var item = atendimento.item;
    if(!item) return;
    var feedback = document.getElementById("at-feedback");

    var assunto = document.getElementById("at-assunto").value;
    var cpf = digitos(document.getElementById("at-cpf").value || "");
    var placa = (document.getElementById("at-placa").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    var descricao = document.getElementById("at-descricao").value;
    var sac = (document.getElementById("at-sac").value || "").trim().toUpperCase();
    var sustentacao = (document.getElementById("at-sustentacao").value || "").trim().toUpperCase();
    var observacao = (document.getElementById("at-observacao").value || "").trim();

    if(!atribuir){
      if(!descricao){ feedback.innerHTML = '<div class="aviso aviso-erro">Escolha a descrição.</div>'; return; }
      if(cpf.length !== 11){ feedback.innerHTML = '<div class="aviso aviso-erro">O CPF precisa ter 11 dígitos.</div>'; return; }
    }

    var fica = !!destino || atribuir || (!!descricao && ehPendente(descricao));
    var alvo = destino ? (acharUsuario(destino) || state.currentUser) : state.currentUser;
    var descricaoFinal = destino ? "" : (atribuir ? (descricao || descricaoPendentePadrao()) : descricao);
    var dados = {
      assunto: assunto,
      cpf: cpf,
      placa: pedePlaca(assunto) ? placa : "",
      descricao: descricaoFinal,
      observacao: observacao,
      sac: fica ? sac : "",
      sustentacao: fica ? sustentacao : "",
      nome: nomeExibido(alvo),
      responsavel: fica ? ((alvo && alvo.username) || "") : "",
      atualizadoEm: new Date().toISOString()
    };

    var salvar = document.getElementById("at-salvar");
    var atribui = document.getElementById("at-atribuir");
    var outro = document.getElementById("at-confirmar-outro");
    salvar.disabled = true; atribui.disabled = true; if(outro) outro.disabled = true;

    try {
      await db.ref("coleta/" + item.id).update(dados);
      for(var k in dados){ if(Object.prototype.hasOwnProperty.call(dados,k)) item[k] = dados[k]; }
      toast(destino ? ("Caso atribuído a " + nomeExibido(alvo) + ".") : (atribuir ? "Caso atribuído a você." : "Caso salvo."));
    } catch(err){
      salvar.disabled = false; atribui.disabled = false; if(outro) outro.disabled = false;
      feedback.innerHTML = '<div class="aviso aviso-erro">' + esc(msgBanco(err)) + '</div>';
      return;
    }

    atendimento.minimizados = atendimento.minimizados.filter(function(i){ return String(i.id) !== String(item.id); });
    atendimento.item = proximoCaso();
    renderDoca();
    renderAtendimento();
    render();
    if(!atendimento.item) toast("Não há mais casos novos nesses assuntos.");
  }

  async function importarColeta(){
    var campo=document.getElementById("coleta-dados"),feedback=document.getElementById("coleta-feedback"),botao=document.getElementById("popup-importar");
    if(botao.disabled)return;
    var texto=campo.value.trim();
    if(!texto){feedback.textContent="Cole os dados antes de importar.";campo.focus();return;}
    var mapa=new Map(),erros=[];
    texto.split(/\r?\n/).forEach(function(linha,n){
      if(!linha.trim() || /^\uFEFF?DATA[;\t]/i.test(linha.trim()))return;
      var detalhada=linha.match(/^Data:\s*(.*?)\s*\|\s*ID:\s*(\d+)\s*\|\s*Assunto:\s*([^|]*?)\s*(?:\|\s*Situa[çc][ãa]o:\s*([^|]*?)\s*)?(?:\|\s*Nota:\s*(\d{1,2})\s*)?$/i);
      var p=detalhada?[detalhada[1],detalhada[2],detalhada[3],detalhada[4]||"",detalhada[5]||""]:linha.split(/[;\t]/).map(function(x){return x.trim();});
      try{
        if(p.length<3 || p.length>5)throw new Error("Colunas fora do padrão");
        var i=normalizarItem({data:p[0],id:p[1],assunto:(p[2]||"").toUpperCase(),situacao:(p[3]||"").toUpperCase(),nota:p[4]});mapa.set(i.id,i);
      }catch(e){erros.push(n+1);}
    });
    if(erros.length){feedback.textContent="Revise as linhas "+erros.join(", ")+". Nada foi importado. Use DATA;ID;ASSUNTO;SITUAÇÃO;NOTA.";return;}
    var itens=Array.from(mapa.values());
    if(!itens.length){feedback.textContent="Nenhum registro encontrado.";return;}
    botao.disabled=true;feedback.textContent="Importando…";
    try{
      var r=await gravarColeta(itens);
      var partes=[r.ativos+" na base ativa"];
      if(r.arquivoAtualizado)partes.push(r.arquivoAtualizado+" já arquivado(s), atualizado(s) no arquivo");
      if(r.ignorados)partes.push(r.ignorados+" já arquivado(s), ignorado(s)");
      campo.value="";feedback.textContent=itens.length+" registro(s) processado(s): "+partes.join(" · ")+". Cada ID existe em um único lugar.";
    }catch(e){feedback.textContent="Importação não concluída: "+e.message+". O texto foi preservado; você pode tentar novamente. Alguns registros podem já ter sido salvos.";}
    finally{botao.disabled=false;}
  }
